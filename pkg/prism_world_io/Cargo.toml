[package]
name = "prism_world_io"
version = "0.1.0"
edition = "2024"
description = "Engine-neutral asynchronous world IO and provider primitives for Prism"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["std"]
std = []
tasks = ["std", "dep:prism_tasks"]
# Native reads use one caller-owned reactor and the existing named IO lane.
# Neither dependency is enabled by the default or no_std builds.
reactor = ["tasks", "prism_tasks/multi_thread", "dep:prism_platform"]

[dependencies]
prism_tasks = { path = "../prism_tasks", optional = true, default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
prism_platform = { path = "../prism_platform", optional = true, default-features = false, features = ["std"] }

[[bench]]
name = "priority_admission"
harness = false
required-features = ["tasks"]

[lints.rust]
unsafe_code = "forbid"
