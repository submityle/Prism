[package]
name = "prism_world_terrain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Engine-neutral cube-sphere terrain, planetary coordinates, LOD, height, and voxel contracts for Prism."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
mesh = ["dep:prism_mesh", "dep:prism_render_driver"]
scatter = ["dep:prism_world_residency"]

[dependencies]
prism_world_stream = { path = "../prism_world_stream", default-features = false }
libm = "0.2"
prism_world_residency = { path = "../prism_world_residency", optional = true }
prism_mesh = { path = "../prism_mesh", optional = true }
prism_render_driver = { path = "../prism_render_driver", optional = true }

[[bench]]
name = "heightfield_bake"
harness = false

[[bench]]
name = "heightfield_scatter"
harness = false
required-features = ["scatter"]

[[bench]]
name = "indexed_heightfield_scatter"
harness = false
required-features = ["scatter"]

[[bench]]
name = "heightfield_placement"
harness = false
required-features = ["scatter"]
