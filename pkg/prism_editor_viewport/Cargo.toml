[package]
name = "prism_editor_viewport"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Renderer-independent viewport, picking, and gizmo interaction contracts for the Prism editor."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
futures-lite = "2"
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal"] }

[features]
default = []
gpu-tests = []

[lints]
workspace = true
