[package]
name = "prism_ui_render_backend"
version = "0.1.0"
edition = "2024"
description = "Loom GPU-driven retained draw-stream backend: draw-command buffer, batching/instancing, SDF rounded-rect/shadow/border, layer compositing and a headless reference backend. Optional wgpu backend validated against the headless twin. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ui = { path = "../prism_ui" }
prism_ui_layout = { path = "../prism_ui_layout" }
prism_ui_style = { path = "../prism_ui_style" }
prism_ui_font = { path = "../prism_ui_font", default-features = false }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal"], optional = true }
bytemuck = { version = "1", optional = true }
futures-lite = { version = "2", optional = true }

[features]
default = ["std"]
std = ["prism_ui/std", "prism_ui_layout/std", "prism_ui_style/std", "prism_ui_font/std", "prism_ui_font/vector"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:futures-lite", "std"]

[lints]
workspace = true

[dev-dependencies]
prism_ui_component_kit = { path = "../prism_ui_component_kit" }
prism_ui_dock = { path = "../prism_ui_dock", features = ["render"] }
prism_ui_theme = { path = "../prism_ui_theme" }
