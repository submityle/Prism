[package]
name = "prism_world_persist"
version = "0.1.0"
edition = "2024"
description = "Deterministic no_std + alloc persistence, timeline, and CRDT core for Prism worlds."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
std = []

[lib]
path = "src/lib.rs"

[[bench]]
name = "crdt_codec"
harness = false

[[test]]
name = "journal_process_lock"
path = "tests/journal_process_lock.rs"
required-features = ["std"]
