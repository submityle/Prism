[package]
name = "prism_ui_store"
version = "0.1.0"
edition = "2024"
description = "Loom store: predictable structured global state with fine-grained selectors and middleware, layered on prism_ui_reactive. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ui_reactive = { path = "../prism_ui_reactive" }

[features]
default = ["std"]
std = ["prism_ui_reactive/std"]

[lints]
workspace = true
