[package]
name = "prism_audio_content"
version = "0.1.0"
edition = "2024"
description = "Content/authoring model for Prism's next-generation audio engine: Events, Actions, RTPC game parameters, State/Switch groups, and Containers (random/sequence/blend/switch). Pure data-driven orchestration with no DSP. Contains no Unreal Engine, Unity, Godot, Wwise, or FMOD source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_content = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = ["prism_audio_core/std", "bevy_math/std"]
serialize = ["dep:serde", "prism_audio_core/serialize", "bevy_math/serialize"]

[lints]
workspace = true
