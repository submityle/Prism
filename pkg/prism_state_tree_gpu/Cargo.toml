[package]
name = "prism_state_tree_gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Real-device wgpu compute twin for Prism StateTree's fixed-point GPU batch contract"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_state_tree_ecs = { path = "../prism_state_tree_ecs" }
bytemuck = { version = "1.5", features = ["derive"] }
futures-lite = "2"
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"] }

[dev-dependencies]
prism_state_tree_gpu = { path = "." }

[lints]
workspace = true
