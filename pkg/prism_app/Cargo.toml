[package]
name = "prism_app"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism's application shell: App / SubApp / Plugin / labeled schedules / main-frame loop / Runner. The in-house replacement for bevy_app, sitting above prism_ecs and below the game runtime framework. Contains no Unreal Engine or Unity source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ecs = { path = "../prism_ecs" }
prism_time = { path = "../prism_time", default-features = false }
prism_window = { path = "../prism_window", optional = true }
prism_window_winit = { path = "../prism_window_winit", optional = true }
# Schema validation / range clamping for reflected configuration (§25.3).
# `math` is off (prism_app configs are not prism_math value types).
prism_reflect = { path = "../prism_reflect", default-features = false, features = ["std"], optional = true }

[features]
# `std` is on by default: the Runner / main loop needs std (design §1). The
# App graph + plugin registry are no_std+alloc-capable in principle, but M0
# ships the std runner, so std is required for now. This is an honest current
# constraint, not a permanent design decision.
default = ["std"]
std = ["prism_time/std"]

# Cross-thread sub-app pipelining (design §9 / §24.3 / §25.2): run a secondary
# (e.g. render) sub-app for frame N on a worker thread while the main sub-app
# simulates frame N+1. Opt-in at runtime via
# `App::enable_pipelined_rendering`; the serial extract path (M3 Inc1) stays
# the default and is the only path when this feature is off. Needs `std`
# (threads), so it implies it.
pipelined = ["std"]

# Determinism & replay (design §15, §22 M5): a seeded reproducible RNG, a
# per-frame state hash for dual-run divergence detection, and transparent
# per-step input record/replay. The primitives are pure core+alloc logic
# (no clocks/threads), so this feature is additive and does not imply `std`;
# an app opts in only when it needs reproducible runs. World-snapshot rollback
# stays out until `prism_ecs` grows a snapshot API (documented in the module).
determinism = []

# Windowed runner (M4, design §10): open a winit window and drive the App on the
# OS event loop. Pulls in the platform backend, so it is off by default; a
# headless / no_std build pays nothing for it.
winit = ["std", "dep:prism_window", "dep:prism_window_winit"]

# Reflected configuration (design §25.3): clamp range-constrained config fields
# and validate a reflected value against its schema, delegating to prism_reflect
# rather than reimplementing the rules. Pulls in prism_reflect (std), so off by
# default.
reflect = ["std", "dep:prism_reflect"]

# Phase-trace (flamegraph) export (design §16, M6 tooling): a bounded per-frame
# phase log with a Chrome-trace JSON dump. std-only (wall-clock timing), off by
# default so an un-observed build pays nothing.
trace = ["std"]

# AAA lint bar. prism_app contains no `unsafe`, so unlike prism_ecs it can keep
# the workspace-strength lints as warnings and still hit zero warnings.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
semicolon_if_nothing_returned = "warn"
ptr_as_ptr = "warn"
type_complexity = "allow"
too_many_arguments = "allow"
needless_lifetimes = "allow"
