[package]
name = "prism_app"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism's application shell: App / SubApp / Plugin / labeled schedules / main-frame loop / Runner. The in-house replacement for bevy_app, sitting above prism_ecs and below the game runtime framework. Contains no Unreal Engine or Unity source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ecs = { path = "../prism_ecs", default-features = false }
prism_time = { path = "../prism_time", default-features = false }
prism_platform = { path = "../prism_platform", default-features = false }
prism_settings = { path = "../prism_settings", default-features = false }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
libm = "0.2"
libloading = { version = "0.8.9", optional = true }
prism_tasks = { path = "../prism_tasks", optional = true }
prism_window = { path = "../prism_window", optional = true }
prism_window_winit = { path = "../prism_window_winit", optional = true }
prism_diagnostic = { path = "../prism_diagnostic", optional = true }
# Schema validation / range clamping for reflected configuration (§25.3).
# `math` is off (prism_app configs are not prism_math value types).
prism_reflect = { path = "../prism_reflect", default-features = false, features = ["std"], optional = true }

[features]
# The App core is no_std + alloc. `std` enables platform clocks/probing,
# process environment access, pacing, diagnostics, and the server runner.
default = ["std"]
std = ["prism_ecs/std", "prism_time/std", "prism_platform/std"]

# §8.2 / §20: dispatch each phase schedule's conflict-free system waves across a
# `prism_tasks` work-stealing pool (stage-internal parallelism). Pulls in
# `prism_ecs/multi_thread` (the conflict-graph executor) + `prism_tasks`, so it
# needs `std`. Off by default; a serial build pays nothing for it.
multi_thread = ["std", "prism_ecs/multi_thread", "dep:prism_tasks"]

# Explicit EcsPolicy-driven LOD callbacks and live-entity cell streaming.
# Positions, frame numbers and cell payload loading remain host supplied.
partition = ["prism_ecs/partition"]

# Cross-thread sub-app pipelining (design §9 / §24.3 / §25.2): run a secondary
# (e.g. render) sub-app for frame N on a worker thread while the main sub-app
# simulates frame N+1. Opt-in at runtime via
# `App::enable_pipelined_rendering`; the serial extract path (M3 Inc1) stays
# the default and is the only path when this feature is off. Needs `std`
# (threads), so it implies it.
pipelined = ["std"]

# M3/§24.3: seat the pipelined render lane on a `prism_tasks` work-stealing
# pool (the engine's unified task graph) instead of a dedicated thread. Opt-in:
# the default `pipelined` lane stays a dedicated thread (lowest latency, render
# cadence independent of the compute pool); this feature adds a pool-backed lane
# and lets a caller inject a shared `TaskPool`. Implies `pipelined` (and `std`).
pipelined-tasks = ["pipelined", "dep:prism_tasks"]

# Determinism & replay (design §15, §22 M5): a seeded reproducible RNG, a
# per-frame state hash for dual-run divergence detection, and transparent
# per-step input record/replay. The primitives are pure core+alloc logic
# (no clocks/threads), so this feature is additive and does not imply `std`;
# an app opts in only when it needs reproducible runs. Snapshot history uses
# prism_ecs WorldSnapshot; this feature also enables rollback input replay.
determinism = []

# Windowed runner (M4, design §10): open a winit window and drive the App on the
# OS event loop. Pulls in the platform backend, so it is off by default; a
# headless / no_std build pays nothing for it.
winit = ["std", "dep:prism_window", "dep:prism_window_winit"]

# Reflected configuration (design §25.3): clamp range-constrained config fields
# and validate a reflected value against its schema, delegating to prism_reflect
# rather than reimplementing the rules. Pulls in prism_reflect (std), so off by
# default.
reflect = ["std", "dep:prism_reflect"]

# Phase-trace (flamegraph) export (design §16, M6 tooling): a bounded per-frame
# phase log with a Chrome-trace JSON dump. std-only (wall-clock timing), off by
# default so an un-observed build pays nothing.
trace = ["std"]

# Native module reload requires dynamic libraries and host synchronization.
module-reload = ["std", "dep:libloading", "reflect"]

# Capture bounded recent diagnostic events in crash reports. Global logger
# installation remains explicit; the adapter can forward to an existing sink.
diagnostic = ["std", "dep:prism_diagnostic"]

# Roadmap §22 "基准即规格": measure the empty frame-loop cost and assert
# fixed-timestep determinism under identical jitter input. Custom harness, so it
# runs as a plain `main` printing timings.
[[bench]]
name = "frame_loop"
harness = false

[[bench]]
name = "runtime_pipeline"
harness = false
required-features = ["multi_thread", "pipelined-tasks"]

[[example]]
name = "runner_parity"
required-features = ["winit", "determinism"]

# AAA lint bar. prism_app contains no `unsafe`, so unlike prism_ecs it can keep
# the workspace-strength lints as warnings and still hit zero warnings.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
semicolon_if_nothing_returned = "warn"
ptr_as_ptr = "warn"
type_complexity = "allow"
too_many_arguments = "allow"
needless_lifetimes = "allow"
