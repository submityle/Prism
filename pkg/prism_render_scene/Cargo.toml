[package]
name = "prism_render_scene"
version = "0.1.0"
edition = "2024"
description = "ECS and GPU integration for Prism's retained GPU scene"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy_app = { path = "../../crates/bevy_app", version = "0.20.0-dev" }
bevy_asset = { path = "../../crates/bevy_asset", version = "0.20.0-dev" }
bevy_ecs = { path = "../../crates/bevy_ecs", version = "0.20.0-dev" }
bevy_derive = { path = "../../crates/bevy_derive", version = "0.20.0-dev" }
bevy_math = { path = "../../crates/bevy_math", version = "0.20.0-dev" }
bevy_material = { path = "../../crates/bevy_material", version = "0.20.0-dev" }
bevy_image = { path = "../../crates/bevy_image", version = "0.20.0-dev" }
bevy_mesh = { path = "../../crates/bevy_mesh", version = "0.20.0-dev" }
bevy_camera = { path = "../../crates/bevy_camera", version = "0.20.0-dev" }
bevy_core_pipeline = { path = "../../crates/bevy_core_pipeline", version = "0.20.0-dev" }
bevy_pbr = { path = "../../crates/bevy_pbr", version = "0.20.0-dev" }
bevy_platform = { path = "../../crates/bevy_platform", version = "0.20.0-dev" }
bevy_render = { path = "../../crates/bevy_render", version = "0.20.0-dev" }
bevy_transform = { path = "../../crates/bevy_transform", version = "0.20.0-dev" }
bevy_shader = { path = "../../crates/bevy_shader", version = "0.20.0-dev" }
wgpu-types = { version = "30", default-features = false }
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
prism_render_architecture = { path = "../prism_render_architecture" }
prism_render_material = { path = "../prism_render_material", features = ["bevy"] }
prism_render_shading = { path = "../prism_render_shading" }
prism_render_visibility = { path = "../prism_render_visibility" }

[lints]
workspace = true
