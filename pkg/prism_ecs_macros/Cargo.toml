[package]
name = "prism_ecs_macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Derive macros (`Component`, `Bundle`) for the `prism_ecs` kernel. Engine-agnostic; contains no Unreal Engine source or derived code and depends on no `bevy_*` crate."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "derive"] }
quote = "1"
proc-macro2 = "1"

[lints]
workspace = true
