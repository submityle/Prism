[package]
name = "prism_editor_profiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Bounded editor profiling models and real CPU/GPU capture producers."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
gpu = ["dep:wgpu"]
gpu-tests = ["gpu", "wgpu/wgsl"]
render-graph = ["dep:prism_render_architecture", "dep:prism_render_graph"]

[dependencies]
prism_render_architecture = { path = "../prism_render_architecture", optional = true }
prism_render_graph = { path = "../prism_render_graph", optional = true }
wgpu = { version = "30", default-features = false, features = ["std", "metal", "vulkan", "dx12"], optional = true }

[dev-dependencies]
prism_render_driver = { path = "../prism_render_driver" }

[[test]]
name = "gpu_capture"
required-features = ["gpu-tests"]

[[test]]
name = "gpu_texture_preview"
required-features = ["gpu-tests", "render-graph"]

[lints]
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
