[package]
name = "prism_audio_ecs"
version = "0.1.0"
edition = "2024"
description = "Native Prism App/ECS audio frontend over the existing lock-free audio runtime"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_app = { path = "../prism_app" }
prism_ecs = { path = "../prism_ecs" }
prism_math = { path = "../prism_math" }
prism_transform = { path = "../prism_transform", features = ["ecs"] }
prism_audio_core = { path = "../prism_audio_core" }
prism_audio_rt = { path = "../prism_audio_rt" }
prism_audio_assets = { path = "../prism_audio_assets" }
prism_audio_device = { path = "../prism_audio_device", default-features = false }
prism_scene = { path = "../prism_scene", default-features = false }
libm = "0.2"

[features]
default = ["cpal-backend"]
cpal-backend = ["prism_audio_device/cpal-backend"]

[dev-dependencies]
prism_asset = { path = "../prism_asset" }
prism_scene = { path = "../prism_scene", features = ["materialize"] }

[lints]
workspace = true
