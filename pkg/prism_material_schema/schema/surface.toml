# Prism PCM self-describing surface schema — the single declarative source of
# truth for the über-BSDF parameter layout (design doc §17.5).
#
# Today the field layout, bit masks, specialization keys, defaults and valid
# ranges are hand-written in six places (Rust `surface.rs`/`record.rs`, the WESL
# `material_unpack`/`classification`/`sample` twins, the CPU golden in
# `prism_render_shading`, the doc field tables §4.4, and the compliance enum
# §4.5). This file reverse-declares that hidden contract so a single codegen can
# later emit all six and byte-parity becomes a constructive result (§17.5.3)
# rather than a test-maintained invariant.
#
# Landing stages (doc §17.5.8): S1 declares and parity-checks this schema
# against the hand-written layout; S2 (current) makes it a generator — the WESL
# `material_unpack` twin and the Rust `surface_layout` constants are emitted
# from this file by `prism-material-codegen`, and `codegen_freshness` tests fail
# on any drift. Byte parity vs `surface.rs` is still guarded by the S1 gate.

schema_version = 2
# Tracks `MATERIAL_ABI_VERSION`. v5 introduced the expanded OpenPBR clearcoat
# block; v6 adds the eight-word material texture row with optional VT metadata.
# VT sampling is not implied by this ABI metadata: the material resolve consumer
# and streaming-resource bindings remain a separate implementation step.
abi_version = 8

# ---------------------------------------------------------------------------
# Core: the always-present OpenPBR-anchored base every lit/stylized/unlit
# surface carries (doc §3.3). The word count is declared below.
# ---------------------------------------------------------------------------
[core]
words = 20

[[core.field]]
name = "base_color"
type = "vec4f"
bit_region = "KHR"
pack_slot = 0
consumed_by = ["unpack", "classify", "sample", "golden", "lit", "npr"]
responses = { lit = { state = "mapped", semantic = "base albedo controls the principled direct response", test = "pkg/prism_render_shading/src/lighting.rs::white_furnace_stays_bounded_across_roughness_and_metalness" }, npr = { state = "mapped", semantic = "base color modulates the tested stylized direct response", test = "pkg/prism_render_shading/src/stylized.rs::stylized_specular_adds_a_bounded_hot_spot" }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# `OpenPBR` `base_color` default `(0.8, 0.8, 0.8)`; the alpha is Prism's own
# coverage channel (opaque = 1).
default = [0.8, 0.8, 0.8, 1.0]
valid = "0.0..=1.0"
energy_policy = "coupled"
view = "invariant"

[[core.field]]
name = "base_metalness"
type = "f32"
bit_region = "KHR"
pack_slot = 4
consumed_by = ["unpack", "classify", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "metalness selects the conductor/base energy branch", test = "pkg/prism_render_shading/src/lighting.rs::white_furnace_stays_bounded_across_roughness_and_metalness" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
default = 0.0
valid = "0.0..=1.0"
energy_policy = "coupled"
view = "invariant"

[[core.field]]
name = "specular_roughness"
type = "f32"
bit_region = "KHR"
pack_slot = 5
consumed_by = ["unpack", "classify", "sample", "golden", "lit", "npr"]
responses = { lit = { state = "mapped", semantic = "roughness controls the principled GGX width", test = "pkg/prism_render_shading/src/lighting.rs::white_furnace_stays_bounded_across_roughness_and_metalness" }, npr = { state = "mapped", semantic = "roughness controls the tested stylized highlight width", test = "pkg/prism_render_shading/src/stylized.rs::stylized_specular_adds_a_bounded_hot_spot" }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# `OpenPBR` `specular_roughness` default `0.3`.
default = 0.3
valid = "0.0..=1.0"
energy_policy = "coupled"
view = "invariant"

[[core.field]]
name = "specular_weight"
type = "f32"
bit_region = "KHR"
pack_slot = 6
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "specular weight scales the dielectric highlight", test = "pkg/prism_render_shading/src/lighting.rs::specular_weight_changes_the_highlight" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# OpenPBR `specular_weight`: scales the dielectric specular lobe. Replaces the
# former `reflectance` proxy; the default 1.0 is the identity.
default = 1.0
valid = "0.0..=1.0"
energy_policy = "coupled"
view = "invariant"

[[core.field]]
name = "ambient_occlusion"
type = "f32"
bit_region = "KHR"
pack_slot = 7
consumed_by = ["unpack", "sample", "golden"]
responses = { lit = { state = "intentionally_unmapped", reason = "The Lit adapter does not interpret this field in the tested response path." }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
default = 1.0
valid = "0.0..=1.0"
energy_policy = "independent"
view = "invariant"

[[core.field]]
name = "normal_scale"
type = "f32"
bit_region = "KHR"
pack_slot = 8
consumed_by = ["unpack", "sample"]
responses = { lit = { state = "intentionally_unmapped", reason = "The Lit adapter does not interpret this field in the tested response path." }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
default = 1.0
valid = "0.0..=2.0"
energy_policy = "none"
view = "invariant"

[[core.field]]
name = "alpha_cutoff"
type = "f32"
bit_region = "KHR"
pack_slot = 9
consumed_by = ["unpack", "classify", "sample"]
responses = { lit = { state = "intentionally_unmapped", reason = "The Lit adapter does not interpret this field in the tested response path." }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
default = 0.5
valid = "0.0..=1.0"
energy_policy = "none"
view = "invariant"

[[core.field]]
name = "base_weight"
type = "f32"
bit_region = "KHR"
pack_slot = 10
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "base weight scales the coupled base layer", test = "pkg/prism_render_shading/src/lighting.rs::base_weight_zero_removes_the_base_layer" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# OpenPBR `base_weight`: scales the base layer (diffuse + specular). The default
# 1.0 is the exact identity, so it reuses a former core padding word and does
# not change the core word count.
default = 1.0
valid = "0.0..=1.0"
energy_policy = "coupled"
view = "invariant"

[[core.field]]
name = "base_diffuse_roughness"
type = "f32"
bit_region = "KHR"
pack_slot = 11
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "diffuse roughness changes the Oren-Nayar base response", test = "pkg/prism_render_shading/src/lighting.rs::diffuse_roughness_changes_the_diffuse_response" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# OpenPBR `diffuse_roughness`: micro-slope roughness of the base diffuse lobe,
# evaluated with the Oren-Nayar V-cavity model. 0 is exactly Lambert (the
# identity the core carried before), so this also reuses a former padding word.
default = 0.0
valid = "0.0..=1.0"
energy_policy = "coupled"
view = "invariant"

[[core.field]]
name = "specular_color"
type = "vec4f"
bit_region = "KHR"
pack_slot = 12
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "specular color tints the dielectric highlight", test = "pkg/prism_render_shading/src/lighting.rs::specular_color_tints_the_dielectric_specular" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# OpenPBR `specular_color`: per-channel tint of the dielectric specular. The
# default is white (the exact identity); metals use `base_color` instead.
default = [1.0, 1.0, 1.0, 1.0]
valid = "0.0..=1.0"
energy_policy = "coupled"
view = "invariant"

[[core.field]]
name = "specular_ior"
type = "f32"
bit_region = "KHR"
pack_slot = 16
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "specular IOR determines dielectric F0", test = "pkg/prism_render_shading/src/lighting.rs::specular_ior_drives_f0_and_reproduces_the_legacy_default" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# OpenPBR `specular_ior`: relative index of the dielectric specular interface,
# replacing the `reflectance` IOR proxy. The default 1.5 gives F0 = 0.04, the
# same value the old `reflectance = 0.5` produced, so defaults are unchanged.
default = 1.5
valid = "1.0..=3.0"
energy_policy = "coupled"
view = "invariant"

[[core.field]]
name = "geometry_thin_walled"
type = "f32"
bit_region = "KHR"
pack_slot = 17
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "thin-walled geometry selects the single-interface transmission path", test = "pkg/prism_render_shading/src/lighting.rs::thin_walled_skips_the_volume_absorption" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# The `OpenPBR` identifier is `geometry_thin_walled` (a boolean in the spec, an
# `f32` 0/1 flag here so it packs into a core word); Prism's decoded fat struct
# keeps the historical short name `thin_walled`. A thin-walled (open) surface
# refracts at a single interface with no volume behind it, so the transmission
# lobe skips the Beer-Lambert depth attenuation. 0.0 (the default) keeps the
# solid-slab path, so this reuses a former core padding word and preserves
# existing behaviour.
surface_field = "thin_walled"
default = 0.0
valid = "0.0..=1.0"
energy_policy = "none"
view = "invariant"

[[core.field]]
name = "geometry_opacity"
type = "f32"
bit_region = "KHR"
pack_slot = 18
consumed_by = ["unpack", "classify", "sample"]
responses = { lit = { state = "intentionally_unmapped", reason = "The Lit adapter does not interpret this field in the tested response path." }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# OpenPBR `geometry_opacity` in [0, 1]: the coverage of the surface, multiplied
# into the alpha the blend/mask path reads. The default 1.0 is the exact
# identity, so this reuses a former core padding word.
default = 1.0
valid = "0.0..=1.0"
energy_policy = "none"
view = "invariant"

[[core.field]]
name = "_pad2"
type = "pad"
bit_region = "KHR"
pack_slot = 19
consumed_by = []
default = 0.0

# ---------------------------------------------------------------------------
# Optional lobes. Each is a uniform 4-word (16-byte) quantum; `registry_slot`
# is the immutable LobeMask bit index (never recycled, doc §5.4) and also the
# canonical low-bit-first pack order. OpenPBR core lobes are namespace `KHR`;
# the stylized face-shadow lobe is Prism-private `PRISM`.
# ---------------------------------------------------------------------------

[[lobe]]
id = "emission"
closure = "Emission"
uid = "org.khronos.openpbr.emission"
registry_slot = 0
mask_const = "EMISSION"
namespace = "KHR"
vendor = "khronos"
stability = "stable"
# Platform capabilities this lobe needs beyond the shared über path (§5.3).
# Empty today: every registered lobe is pure ALU + the standard bindings.
requires_caps = []
words = 8

[[lobe.field]]
name = "emission_color"
type = "vec4f"
bit_region = "KHR"
pack_slot = 0
consumed_by = ["unpack", "classify", "sample", "golden"]
responses = { lit = { state = "intentionally_unmapped", reason = "The Lit adapter does not interpret this field in the tested response path." }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# `OpenPBR` `emission_color` default `(1, 1, 1)`; with the specification's
# `emission_luminance == 0` default the emitted radiance is exactly zero, so the
# factorisation matches the spec without changing the neutral surface's output.
default = [1.0, 1.0, 1.0, 1.0]
valid = "0.0..=inf"
energy_policy = "independent"
view = "invariant"

[[lobe.field]]
name = "emission_luminance"
type = "f32"
bit_region = "KHR"
pack_slot = 4
consumed_by = ["unpack", "sample", "golden"]
responses = { lit = { state = "intentionally_unmapped", reason = "The Lit adapter does not interpret this field in the tested response path." }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# OpenPBR `emission_luminance` in nits. Emission radiance is
# `emission_color * emission_luminance`. Prism now takes the specification's
# default `0` (the neutral surface emits nothing); the importer factors a legacy
# material's authored radiance into colour × luminance so its look is preserved
# explicitly rather than through a non-spec default.
default = 0.0
valid = "0.0..=inf"
energy_policy = "independent"
view = "invariant"

[[lobe.field]]
name = "_pad0"
type = "pad"
bit_region = "KHR"
pack_slot = 5
consumed_by = []
default = 0.0

[[lobe.field]]
name = "_pad1"
type = "pad"
bit_region = "KHR"
pack_slot = 6
consumed_by = []
default = 0.0

[[lobe.field]]
