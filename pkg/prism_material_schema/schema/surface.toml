responses = { lit = { state = "mapped", semantic = "glint parameters control deterministic discrete microfacet response", test = "pkg/prism_render_shading/src/lighting.rs::glint_is_deterministic_and_decorrelates_in_space_and_direction" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
default = 0.0
valid = "0.0..=1.0"
# Blends the discrete NDF into the specular lobe, which already owns an energy
# budget (§17.2) — hence `coupled`, not `independent`: the estimator is
# unbiased, so it re-shapes the highlight without changing its energy.
energy_policy = "coupled"
view = "dependent"

[[lobe.field]]
name = "glint_roughness"
type = "f32"
bit_region = "PRISM"
pack_slot = 1
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "glint parameters control deterministic discrete microfacet response", test = "pkg/prism_render_shading/src/lighting.rs::glint_is_deterministic_and_decorrelates_in_space_and_direction" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# Orientation roughness of the *flakes* (the GGX-shaped distribution the
# discrete estimator samples), independent of the base `specular_roughness`.
default = 0.1
valid = "0.0..=1.0"
energy_policy = "none"
view = "dependent"

[[lobe.field]]
name = "glint_density"
type = "f32"
bit_region = "PRISM"
pack_slot = 2
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "glint parameters control deterministic discrete microfacet response", test = "pkg/prism_render_shading/src/lighting.rs::glint_is_deterministic_and_decorrelates_in_space_and_direction" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# Facets per unit² of the shade-time surface-cell space (the UV cell the seed
