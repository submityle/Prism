bit_region = "KHR"
pack_slot = 8
consumed_by = ["unpack", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "clearcoat parameters shape the coupled coat lobe", test = "pkg/prism_render_shading/src/clearcoat.rs::clearcoat_is_finite_and_non_negative_across_parameters" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
