[[lobe.field]]
name = "specular_roughness_anisotropy"
type = "f32"
bit_region = "KHR"
pack_slot = 0
spec_subfield = "closure_mask"
consumed_by = ["unpack", "classify", "sample", "golden", "lit"]
responses = { lit = { state = "mapped", semantic = "anisotropy parameters stretch and rotate the conductor lobe", test = "pkg/prism_render_shading/src/lighting.rs::positive_anisotropy_stretches_the_tangent_lobe" }, npr = { state = "intentionally_unmapped", reason = "The NPR adapter does not interpret this field in the tested response path." }, unlit = { state = "intentionally_unmapped", reason = "The Unlit contract does not claim decode-only field evidence for this field." } }
# The `OpenPBR` identifier is `specular_roughness_anisotropy`; Prism's decoded fat
# struct keeps the historical short name `anisotropy` (the elongation direction
# comes from `geometry_tangent`, so there is no separate rotation in the spec; the
# optional `anisotropy_rotation` field below is a Prism extension). The shading
# path maps `[0,1]` to the two GGX widths via the specification's
# `openpbr-anisotropy-formula`: `α_t = r²·sqrt(2/(1+(1−a)²))`, `α_b = (1−a)·α_t`.
surface_field = "anisotropy"
default = 0.0
valid = "0.0..=1.0"
energy_policy = "coupled"
view = "dependent"

