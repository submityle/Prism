[[lobe]]
id = "anisotropy"
closure = "Conductor"
uid = "org.khronos.openpbr.specular_anisotropy"
registry_slot = 2
mask_const = "ANISOTROPY"
namespace = "KHR"
vendor = "khronos"
stability = "stable"
# Platform capabilities this lobe needs beyond the shared über path (§5.3).
