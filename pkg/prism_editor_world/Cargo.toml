[package]
name = "prism_editor_world"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Deterministic editor-side world partition model for cell residency, data layers, edit scopes, and per-cell persistence planning."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_asset = { path = "../prism_asset", default-features = false }
prism_ecs = { path = "../prism_ecs", default-features = false, features = ["std", "partition"] }
prism_scene = { path = "../prism_scene", default-features = false, features = ["std", "partition"] }

[lints]
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
