[package]
name = "prism_world_runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Engine-neutral world streaming to IO coordination for Prism"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_world = { path = "../prism_world", default-features = false }
prism_world_stream = { path = "../prism_world_stream" }
prism_world_io = { path = "../prism_world_io", default-features = false }
prism_world_persist = { path = "../prism_world_persist", default-features = false }
prism_world_residency = { path = "../prism_world_residency" }
prism_asset = { path = "../prism_asset", optional = true }
prism_asset_container = { path = "../prism_asset_container", optional = true }
prism_world_terrain = { path = "../prism_world_terrain", optional = true, default-features = false, features = ["scatter"] }
prism_tasks = { path = "../prism_tasks", optional = true, default-features = false, features = ["std"] }
prism_world_gpu = { path = "../prism_world_gpu", optional = true, default-features = false }
prism_ecs = { path = "../prism_ecs", optional = true, default-features = false }
prism_scene = { path = "../prism_scene", optional = true, default-features = false, features = ["std"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"], optional = true }

[features]
default = ["std"]
# Full-key CPU heightfield placement deletion persistence; no GPU dependency.
placement = ["dep:prism_world_terrain"]
std = ["prism_world_io/std", "prism_world_persist/std"]
asset_container = ["std", "dep:prism_asset", "dep:prism_asset_container"]
scene_templates = ["asset_container", "dep:prism_scene", "dep:prism_ecs", "prism_scene/materialize"]
# Uses the validated mmap-backed v2 container index in World cell providers.
asset_container_mmap = ["asset_container", "prism_asset_container/mmap"]
tasks = ["std", "dep:prism_tasks", "prism_world_io/tasks"]
# Host-owned native reactor and IO workers; no default feature expansion.
reactor = ["tasks", "prism_world_io/reactor"]
# Derived CPU proxy ownership; does not enable wgpu or create a GPU device.
proxy_host = ["std", "dep:prism_world_gpu"]
# Real wgpu-backed proxy lifecycle; keeps the authoritative scene host borrowed
# and enables only the explicit GPU frame-boundary methods in the adapter.
gpu_proxy = ["proxy_host", "dep:wgpu", "prism_world_gpu/gpu"]
# ECS request/result components plus a real GPU dispatch/readback bridge.
sdf_ecs_gpu = ["gpu_proxy", "dep:prism_ecs"]

[[bench]]
name = "threaded_archive"
harness = false
required-features = ["std"]

[[bench]]
name = "scatter_deletions"
harness = false
required-features = ["std"]

[[bench]]
name = "hlod_plan"
harness = false
required-features = ["std"]

[[example]]
name = "placement_deletions"
required-features = ["std", "placement"]

[[bench]]
name = "placement_deletions"
harness = false
required-features = ["std", "placement"]

[lints.rust]
unsafe_code = "forbid"
