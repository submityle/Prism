[package]
name = "prism_world_network"
version = "0.1.0"
edition = "2024"
description = "Deterministic no_std world-to-network AOI, authority, handoff, and merge contracts for Prism."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_world_persist = { path = "../prism_world_persist", default-features = false }
prism_world_stream = { path = "../prism_world_stream", default-features = false }

[features]
default = []
std = []

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
