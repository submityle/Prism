[package]
name = "prism_ui_component_kit"
version = "0.1.0"
edition = "2024"
description = "Loom component kit: a Liquid-Glass styled, light/dark component library (buttons, inputs, pickers, containers, feedback, navigation, editor and node-editor controls) built on prism_ui. Style flows exclusively through theme tokens. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ui = { path = "../prism_ui" }
prism_ui_component = { path = "../prism_ui_component" }
prism_ui_style = { path = "../prism_ui_style" }
prism_ui_theme = { path = "../prism_ui_theme" }
prism_ui_a11y = { path = "../prism_ui_a11y" }

[dev-dependencies]
prism_ui_workbench = { path = "../prism_ui_workbench" }
prism_ui_render_backend = { path = "../prism_ui_render_backend" }

[features]
default = ["std"]
# Dev-only: mounts every control for the real-instance gallery example.
gallery = []
std = [
  "prism_ui/std",
  "prism_ui_component/std",
  "prism_ui_style/std",
  "prism_ui_theme/std",
  "prism_ui_a11y/std",
]

[lints]
workspace = true

[[example]]
name = "gallery_real"
required-features = ["gallery"]
