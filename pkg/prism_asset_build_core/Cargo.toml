[package]
name = "prism_asset_build_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Deterministic asset-build protocol primitives, local CAS, and atomic manifest publication."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
blake3 = "1.8"
ring = "0.17.14"
png = "0.18.1"
prism_asset = { path = "../prism_asset" }
prism_image = { path = "../prism_image" }
prism_asset_container = { path = "../prism_asset_container" }
prism_mesh = { path = "../prism_mesh" }
prism_render_architecture = { path = "../prism_render_architecture" }
prism_render_driver = { path = "../prism_render_driver" }
rustix = { version = "1.1.5", features = ["fs"] }
tempfile = "3.27"

[[bench]]
name = "mesh_virtual_geometry"
harness = false

[lints]
workspace = true
