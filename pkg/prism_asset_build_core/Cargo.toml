[package]
name = "prism_asset_build_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Deterministic asset-build protocol primitives, local CAS, and atomic manifest publication."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
ecs = ["dep:prism_ecs", "dep:prism_app"]

[dependencies]
blake3 = "1.8"
fs4 = "0.13.1"
ring = "0.17.14"
png = "0.18.1"
prism_asset = { path = "../prism_asset" }
prism_image = { path = "../prism_image" }
prism_asset_container = { path = "../prism_asset_container" }
prism_mesh = { path = "../prism_mesh" }
prism_render_architecture = { path = "../prism_render_architecture" }
prism_render_driver = { path = "../prism_render_driver" }
prism_tasks = { path = "../prism_tasks" }
prism_reflect = { path = "../prism_reflect", default-features = false, features = ["std"] }
prism_ecs = { path = "../prism_ecs", default-features = false, features = ["std"], optional = true }
prism_app = { path = "../prism_app", default-features = false, features = ["std"], optional = true }
tempfile = "3.27"

[[bench]]
name = "mesh_virtual_geometry"
harness = false

[lints]
workspace = true
