[package]
name = "prism_render_gpudriven"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "GPU-driven culling vertical slice for Prism's RHI: a compute pass frustum-culls a batch of instance AABBs, appends the survivors through an atomic counter, and authors the indirect-draw arguments on the GPU; a render pass then consumes those GPU-written arguments through DrawIndexedIndirect/MultiDrawIndirect so the CPU never learns the surviving count. Ships a CPU reference cull and a GPU test that asserts the two agree. The prototype drives the frozen prism_render_driver RHI through its wgpu backend."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_render_architecture = { path = "../prism_render_architecture" }
prism_render_driver = { path = "../prism_render_driver", features = ["std"] }
# The frame graph the GPU-driven scene is declared through: the reset + cull +
# draw passes are all graph passes, so the slice exercises the M2 headline
# ("prism_render_graph + GPU-driven") rather than a hand-rolled encoder.
prism_render_graph = { path = "../prism_render_graph" }
# The shipped RHI backend this slice is verified against. The stage APIs
# themselves take the RHI traits; only the readback hook names the backend.
prism_render_driver_wgpu = { path = "../../os-backends/prism_render_driver_wgpu" }

[dev-dependencies]
# The headless RHI backend, so the declared frame graph can be compiled and
# checked on any host without a GPU (the GPU tests skip in the base sandbox).
prism_render_driver_null = { path = "../../os-backends/prism_render_driver_null" }
naga = { version = "30.0.1", features = ["wgsl-in"] }

[lints]
workspace = true
