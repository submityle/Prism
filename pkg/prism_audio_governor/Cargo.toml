[package]
name = "prism_audio_governor"
version = "0.1.0"
edition = "2024"
description = "Performance-adaptive governance and psychoacoustic virtualization for Prism's next-generation audio engine: CPU-budget closed-loop QualityGovernor with audio LOD (sections 32), plus masking-aware virtualization and source clustering (section 33). Deterministic classical DSP, no ML. Contains no Unreal Engine, Unity, Godot, Wwise, FMOD, Steam Audio, or Google Resonance Audio source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_governor = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = ["prism_audio_core/std", "bevy_math/std"]
serialize = ["dep:serde", "prism_audio_core/serialize", "bevy_math/serialize"]

[lints]
workspace = true
