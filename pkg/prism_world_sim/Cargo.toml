[package]
name = "prism_world_sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Deterministic engine-neutral no_std world simulation primitives for Prism."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
persist = ["dep:prism_world_persist"]

[dependencies]
prism_world_persist = { path = "../prism_world_persist", default-features = false, optional = true }
