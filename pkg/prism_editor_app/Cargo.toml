[package]
name = "prism_editor_app"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Headless and window-independent assembly of the Prism editor kernel and panel data layers."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_editor_core = { path = "../prism_editor_core" }
prism_editor_panels = { path = "../prism_editor_panels" }
prism_editor_content = { path = "../prism_editor_content" }
prism_editor_viewport = { path = "../prism_editor_viewport" }
prism_editor_profiler = { path = "../prism_editor_profiler" }
prism_editor_ui = { path = "../prism_editor_ui" }
prism_editor_dock = { path = "../prism_editor_dock" }
prism_editor_reflect = { path = "../prism_editor_reflect" }
prism_editor_shell = { path = "../prism_editor_shell" }
prism_editor_world = { path = "../prism_editor_world" }
prism_editor_timeline = { path = "../prism_editor_timeline" }
prism_editor_graph = { path = "../prism_editor_graph" }
prism_asset = { path = "../prism_asset" }
prism_app = { path = "../prism_app", default-features = false, features = ["std"] }
prism_camera_ecs = { path = "../prism_camera_ecs", default-features = false, features = ["composition_aid"], optional = true }
prism_camera = { path = "../prism_camera", default-features = false, features = ["composition_aid"], optional = true }
prism_ecs = { path = "../prism_ecs", default-features = false, features = ["std", "reflect"] }
prism_reflect = { path = "../prism_reflect" }
prism_math = { path = "../prism_math", optional = true }
prism_ui = { path = "../prism_ui" }
prism_ui_layout = { path = "../prism_ui_layout" }
prism_ui_render_backend = { path = "../prism_ui_render_backend" }
winit = { version = "0.30", optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"], optional = true }
futures-lite = { version = "2", optional = true }

[features]
default = []
desktop = ["dep:winit", "dep:wgpu", "dep:futures-lite", "dep:prism_math", "dep:prism_camera_ecs", "dep:prism_camera", "prism_ui_render_backend/gpu"]
runtime-preview = ["desktop", "prism_editor_ui/frame-graph-preview", "prism_editor_profiler/runtime-preview"]

[dev-dependencies]
png = "0.18.1"
prism_editor_profiler = { path = "../prism_editor_profiler", features = ["render-graph"] }
prism_render_architecture = { path = "../prism_render_architecture" }
prism_render_graph = { path = "../prism_render_graph" }
prism_render_driver = { path = "../prism_render_driver" }
prism_render_driver_wgpu = { path = "../../os-backends/prism_render_driver_wgpu" }

[lints]
workspace = true
