[package]
name = "prism_state_tree_ecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "ECS assembly for Prism StateTree runtime instances"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ecs = { path = "../prism_ecs", default-features = false }
prism_state_tree_core = { path = "../prism_state_tree_core" }
prism_app = { path = "../prism_app", optional = true }
prism_reflect = { path = "../prism_reflect", optional = true }

[features]
default = []
app = ["dep:prism_app"]
reflect = ["dep:prism_reflect"]

[lints]
workspace = true
