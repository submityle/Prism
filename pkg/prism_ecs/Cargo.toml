[package]
name = "prism_ecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism's next-generation data-oriented ECS kernel (greenfield chunked-archetype). no_std + alloc core; cache-friendly columnar storage, generational entities, archetype graph, and ergonomic queries. Contains no Unreal Engine source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
libm = "0.2"
prism_ecs_macros = { path = "../prism_ecs_macros" }
prism_platform = { path = "../prism_platform", optional = true }
prism_reflect = { path = "../prism_reflect", optional = true }
prism_tasks = { path = "../prism_tasks", optional = true }

[dev-dependencies]
prism_ecs = { path = "." }
prism_math = { path = "../prism_math" }
prism_time = { path = "../prism_time" }
prism_transform = { path = "../prism_transform", features = ["determinism"] }

[features]
default = ["std"]
# Enable std-backed facilities (used to light up std-only tests and the
# multi-threaded executor). The core kernel is no_std + alloc.
std = []
# The parallel conflict-graph executor (§8.2): dispatches conflict-free waves
# onto a `prism_tasks` work-stealing pool. Pulls in `prism_tasks` and `std`.
multi_thread = ["std", "dep:prism_tasks"]

# Stackful-fiber-backed waits for the system-internal job graph (§8.3). This
# composes with prism_tasks rather than introducing a second ECS-owned pool.
fibers = ["multi_thread", "prism_tasks/fibers"]

# Reflection bridge (design §16.5 / §24.3): register a component type so an
# editor / scene loader / replication layer can read, overwrite, remove and
# enumerate it *dynamically* by `StableTypeId`, without naming the Rust type.
# Pulls in `prism_reflect` (and `std`), so the base kernel stays free of it.
reflect = ["std", "dep:prism_reflect"]

# VM-backed chunk arena (design §17 大页竞技场分配): the table's chunk blocks are
# carved from one large, page-aligned — and, where the platform supports it,
# huge-page-backed — reservation per arena instead of one global allocation per
# chunk. Pulls in `prism_platform` and `std`; the base kernel keeps its plain
# per-block global allocation.
vm = ["std", "dep:prism_platform"]

# Reflect-driven binary archives (design §16.5 / §24.3): save/load an entity
# set's reflected components through `prism_reflect`'s binary format, so a
# save file or prefab payload needs no per-component glue. Builds on `reflect`.
serialize = ["reflect"]

# SIMD-accelerated bulk column kernels (design §7/§17). Hot component columns
# are iterated through per-arch `core::arch` intrinsics (SSE2 on x86_64, NEON on
# aarch64) with a portable scalar reference fallback — the same backend-selection
# discipline as `prism_math`. The scalar path is the behavioural ground truth;
# every SIMD kernel is cross-checked value-for-value against it in a golden
# dual-run test. No `portable_simd`/nightly: the crate stays on stable.
simd = []

# World Partition streaming + entity LOD/dormancy + 64-bit floating origin
# (design §13 / §3 quality tier). An opt-in scale tier: the base build pays
# nothing for large-world machinery, while high-end desktop/console enables it.
# no_std + alloc clean; does not require `std`.
partition = []

# GPU-resident component columns with dirty-block tracking (design §15 / §3).
# Opt-in GPU-driven tier: CPU upload planning + incremental dirty spans live
# here; buffer ownership, mapping and upload are on the render side. The base build
# pays nothing. no_std + alloc clean; does not require `std`.
gpu_resident = []

# Dual-run determinism auditing (design §14 / §24.4). The per-frame state
# hash (§14 "逐帧状态哈希去同步") is always-on infrastructure; this tier adds
# the debugging layer that turns a mismatched hash into a coordinate:
# `FrameHashLog` locates the first diverging tick between two runs, and
# `locate_divergence` pinpoints the first diverging (entity, component) cell
# within a frame. Opt-in: lockstep/rollback titles enable it to debug
# desync, while the base build pays nothing. no_std + alloc clean.
determinism = []

# Structured trace event stream + Chrome/Perfetto timeline export (design
# §16.6 / §19). This is the dual of the §16.6 flame-graph profiler: the
# profiler folds spans into a self-time tree, while `trace` keeps the ordered
# event stream (explicit timestamps + parallel tracks) and serialises it to
# Chrome Trace Event Format JSON for offline inspection in `chrome://tracing`
# / Perfetto. The core (`event`/`buffer`/`chrome`) is no_std + alloc clean and
# shares the `SystemInstrument` capture hook; the `TraceRecorder` live capture
# layer additionally needs `std` (wall-clock origin) and is `std`-gated.

trace = []

# NOTE: this crate intentionally does NOT inherit `[lints] workspace = true`.
# A type-erased columnar ECS fundamentally requires `unsafe` for component
# storage, so the workspace-wide `unsafe_code = "deny"` cannot apply here.
# We re-declare the same high-signal lints and keep `undocumented_unsafe_blocks`
# as "warn" so every `unsafe` block must carry a `// SAFETY:` justification.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
semicolon_if_nothing_returned = "warn"
ptr_as_ptr = "warn"
type_complexity = "allow"
too_many_arguments = "allow"
needless_lifetimes = "allow"
