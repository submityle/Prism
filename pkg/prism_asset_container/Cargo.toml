[package]
name = "prism_asset_container"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Deterministic runtime container writer/reader with strict validation, range reads, and priority overlays for Prism assets."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
blake3 = "1.8"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
memmap2 = { version = "0.9", optional = true }
prism_asset = { path = "../prism_asset" }
prism_gdeflate_gpu = { path = "../prism_gdeflate_gpu", optional = true }
prism_render_architecture = { path = "../prism_render_architecture", optional = true }

[features]
default = []
mmap = ["dep:memmap2"]
gpu = ["dep:prism_gdeflate_gpu", "dep:prism_render_architecture"]

[lints]
workspace = true

[[test]]
name = "read_budget"
path = "text/integration/read_budget.rs"

[[test]]
name = "block_format"
path = "text/integration/block_format.rs"

[[test]]
name = "resident_blocks"
path = "text/integration/resident_blocks.rs"
required-features = ["gpu"]

[[test]]
name = "resident_manifest"
path = "text/integration/resident_manifest.rs"
required-features = ["gpu"]
