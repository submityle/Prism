[package]
name = "prism_render_app"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "The seam that wires Prism's RHI render runtime (prism_render_runtime) into prism_app as a dedicated render SubApp: a PrismRenderPlugin that owns the GPU device for the app's lifetime, extracts a minimal render record from the main world into the render world, and runs a frame graph each frame in a render schedule. The in-house replacement for bevy_render's RenderApp host. Contains no Unreal Engine or Unity source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_app = { path = "../prism_app" }
prism_asset = { path = "../prism_asset", features = ["ecs"] }
# The material ABI is a dense `u32` array; the buffers upload it as bytes.
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
prism_ecs = { path = "../prism_ecs", features = ["gpu_resident"] }
prism_render_architecture = { path = "../prism_render_architecture" }
prism_image = { path = "../prism_image" }
prism_mesh = { path = "../prism_mesh" }
prism_math = { path = "../prism_math" }
prism_particle_app = { path = "../prism_particle_app" }
prism_render_material = { path = "../prism_render_material" }
prism_render_gpudriven = { path = "../prism_render_gpudriven" }
prism_render_visibility = { path = "../prism_render_visibility" }
prism_render_driver = { path = "../prism_render_driver", features = ["std"] }
prism_render_graph = { path = "../prism_render_graph" }
prism_render_runtime = { path = "../prism_render_runtime" }
prism_tasks = { path = "../prism_tasks" }
prism_transform = { path = "../prism_transform", features = ["ecs"] }
prism_window = { path = "../prism_window" }
raw-window-handle = { version = "0.6", default-features = false }
prism_window_winit = { path = "../prism_window_winit", optional = true }

[features]
default = []
# Connect the App's real OS windows to the same presentation driver.
winit = ["prism_app/winit", "dep:prism_window_winit"]

[dev-dependencies]
# The headless reference backend: drives the extract + render path in CI with
# no window and no GPU.
prism_render_driver_null = { path = "../../os-backends/prism_render_driver_null" }
# The shipped hardware backend, used by the GPU-gated readback test.
prism_render_driver_wgpu = { path = "../../os-backends/prism_render_driver_wgpu" }

[lints]
workspace = true
