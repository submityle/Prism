[package]
name = "prism_world"
version = "0.1.0"
edition = "2024"
description = "Prism world-system facade joining deterministic streaming, residency, and persistence policy."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_world_persist = { path = "../prism_world_persist" }
prism_world_residency = { path = "../prism_world_residency" }
prism_world_stream = { path = "../prism_world_stream" }
prism_asset = { path = "../prism_asset", optional = true }
prism_ecs = { path = "../prism_ecs", default-features = false, features = ["std"], optional = true }
prism_scene = { path = "../prism_scene", default-features = false, features = ["std", "materialize"], optional = true }

[features]
default = []
scene_host = ["dep:prism_asset", "dep:prism_ecs", "dep:prism_scene"]

[[bench]]
name = "world_tick"
harness = false

[lints]
workspace = true
