[package]
name = "prism_replication"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism's authority / replication kernel (design docs/prism_network_design_zh.md): the pure, transport-independent core the multiplayer layer builds on — command sequencing (Lamport logical clock + per-source in-order delivery windows) and, as it grows, state-delta replication primitives. Sits above prism_scene/persist/ecs/time as a cross-cutting layer. Contains no Unreal Engine or Unity source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_math = { path = "../prism_math", default-features = false }
prism_app = { path = "../prism_app", optional = true }
prism_ecs = { path = "../prism_ecs", optional = true }
prism_reflect = { path = "../prism_reflect", optional = true }
prism_scene = { path = "../prism_scene", default-features = false, optional = true }
prism_world = { path = "../prism_world", optional = true }
ring = { version = "0.17.14", optional = true }
getrandom = { version = "0.4", optional = true }

[features]
default = []
# `std`-only pieces: the shared in-memory transport and the `prism_app` seam.
std = ["dep:getrandom"]
# The `prism_app` integration (§25.2): a `ReplicationPlugin` that drives a client
# session from the app's frame loop. Pulls in `prism_app` (std).
app = ["std", "dep:prism_app", "prism_app/determinism", "dep:prism_ecs"]
# Opt-in ECS snapshot hash exchange. Peers must enable the same wire contract.
determinism = ["app", "prism_ecs/determinism"]
# Real ECS replication provider. This is separate from `app`: callers that
# already own their frame loop can use the provider without pulling in the app
# plugin or its rollback policy.
ecs = [
    "std",
    "dep:prism_ecs",
    "dep:prism_reflect",
    "prism_ecs/reflect",
    "prism_ecs/serialize",
]
# Test-only app schedule parallelism; the ECS bridge remains usable in the
# serial `app` build, while its worker-count comparison opts into the real
# prism_app multi-thread executor.
multi_thread = ["app", "prism_app/multi_thread"]
# Scene/world identity and ownership adapters. The world facade remains the
# owner of streaming/residency policy; this feature only consumes its real
# scene-host types at the boundary.
scene_world = [
    "ecs",
    "dep:prism_scene",
    "dep:prism_world",
    "prism_scene/std",
    "prism_scene/materialize",
    "prism_world/scene_host",
]
# A reviewed production provider: PSK-authenticated handshake plus AES-256-GCM.
# The provider remains explicit so callers choose their credential and rotation
# policy instead of silently falling back to a shared test key.
crypto = ["std", "dep:ring"]

[lints]
workspace = true

[[test]]
name = "udp_acceptance"
path = "tests/udp_acceptance.rs"
required-features = ["std"]
