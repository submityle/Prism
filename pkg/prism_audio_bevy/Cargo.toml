[package]
name = "prism_audio_bevy"
version = "0.1.0"
edition = "2024"
description = "Compatibility facade for Prism's native ECS audio bridge."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_ecs = { path = "../prism_audio_ecs" }

[dev-dependencies]
prism_app = { path = "../prism_app" }
prism_audio_core = { path = "../prism_audio_core" }
prism_audio_rt = { path = "../prism_audio_rt" }
prism_ecs = { path = "../prism_ecs" }
prism_math = { path = "../prism_math" }
prism_transform = { path = "../prism_transform", features = ["ecs"] }

[lints]
workspace = true
