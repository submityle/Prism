[package]
name = "prism_gdeflate_gpu"
version = "0.1.0"
edition = "2024"
description = "Optional wgpu compute backend for Prism's GDeflate asset-streaming decompressor: stored, fixed and dynamic Huffman blocks decoded entirely on GPU with explicit CPU fallback telemetry. Container parsing and checksum validation remain on the host. Contains no Unreal Engine or NVIDIA GDeflate source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_render_architecture = { path = "../prism_render_architecture" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"] }
bytemuck = { version = "1.5", features = ["derive"] }
futures-lite = "2"

[lints]
workspace = true
