[package]
name = "prism_world_gpu"
version = "0.1.0"
edition = "2024"
description = "Engine-neutral world proxy visibility contract with a real wgpu compute parity backend."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
gpu = ["dep:bytemuck", "dep:futures-lite", "dep:wgpu", "dep:prism_world_residency"]
terrain_scatter = ["gpu", "dep:prism_world_terrain"]
placement_rhi = ["terrain_scatter", "dep:prism_render_driver_wgpu"]

[dependencies]
prism_world_stream = { path = "../prism_world_stream", default-features = false }
prism_render_driver = { path = "../prism_render_driver", default-features = false, features = ["std"] }
prism_render_graph = { path = "../prism_render_graph" }
prism_render_driver_wgpu = { path = "../../os-backends/prism_render_driver_wgpu", optional = true }
prism_world_residency = { path = "../prism_world_residency", optional = true }
prism_world_terrain = { path = "../prism_world_terrain", features = ["scatter"], optional = true }
bytemuck = { version = "1.5", features = ["derive"], optional = true }
futures-lite = { version = "2", optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"], optional = true }

[dev-dependencies]
bytemuck = { version = "1.5", features = ["derive"] }
futures-lite = "2"
prism_world_terrain = { path = "../prism_world_terrain", features = ["mesh"] }
prism_world_runtime = { path = "../prism_world_runtime", features = ["gpu_proxy"] }
prism_world_io = { path = "../prism_world_io", default-features = false }
prism_render_driver_null = { path = "../../os-backends/prism_render_driver_null" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"] }

[[bench]]
name = "resident_visibility"
harness = false
required-features = ["gpu"]

[[bench]]
name = "registry"
harness = false

[[bench]]
name = "scatter_generation"
harness = false
required-features = ["gpu"]

[[bench]]
name = "scatter_field"
harness = false
required-features = ["gpu"]

[[bench]]
name = "scatter_brush_index"
harness = false
required-features = ["gpu"]

[[bench]]
name = "scatter_heightfield"
harness = false
required-features = ["terrain_scatter"]

[[bench]]
name = "scatter_deletion"
harness = false
required-features = ["gpu"]

[[bench]]
name = "heightfield_placement"
harness = false
required-features = ["terrain_scatter"]

[[bench]]
name = "heightfield_placement_deletion"
harness = false
required-features = ["terrain_scatter"]
