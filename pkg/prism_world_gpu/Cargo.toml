[package]
name = "prism_world_gpu"
version = "0.1.0"
edition = "2024"
description = "Engine-neutral world proxy visibility contract with a real wgpu compute parity backend."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
gpu = ["dep:bytemuck", "dep:futures-lite", "dep:wgpu", "dep:prism_world_residency"]

[dependencies]
prism_world_stream = { path = "../prism_world_stream", default-features = false }
prism_world_residency = { path = "../prism_world_residency", optional = true }
bytemuck = { version = "1.5", features = ["derive"], optional = true }
futures-lite = { version = "2", optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"], optional = true }

[dev-dependencies]
bytemuck = { version = "1.5", features = ["derive"] }
futures-lite = "2"
prism_world_terrain = { path = "../prism_world_terrain", features = ["mesh"] }
prism_world_runtime = { path = "../prism_world_runtime", features = ["proxy_host"] }
prism_world_io = { path = "../prism_world_io", default-features = false }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"] }

[[bench]]
name = "resident_visibility"
harness = false
required-features = ["gpu"]

[[bench]]
name = "registry"
harness = false

[[bench]]
name = "scatter_generation"
harness = false
required-features = ["gpu"]

[[bench]]
name = "scatter_field"
harness = false
required-features = ["gpu"]
