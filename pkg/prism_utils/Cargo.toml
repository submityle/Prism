[package]
name = "prism_utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism foundational container/utility kernel (L1 root, peer of prism_math): SmallVec/ArrayVec inline storage, a typed index Arena, and a SwissTable-style HashMap/HashSet facade over a fast FxHasher, plus a prelude. M0 ships the core safe containers; concurrent/determinism/serde/SIMD-hash features land later. Contains no Unreal Engine source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]

[features]
default = ["std", "determinism"]
std = []
# Deterministic (insertion-ordered) containers. Like `std`, this is a declared
# capability flag: the determinism tier is pure safe code with no extra cost
# when unused, so it is always compiled (mirroring the crate's `std` feature).
determinism = []
# M5 lock-free / sharded concurrent containers (MPMC/SPSC queues, a sharded
# concurrent hash map, an epoch-based reclaimer and a lock-free Treiber stack
# built on it). These need real atomics and OS synchronization primitives, so
# the tier pulls in `std`. It is OFF by default: lock-free code is only paid
# for when a consumer explicitly opts in (the conservative default from the
# design doc §11/§24.2).
concurrent = ["std"]
# M6 `bevy_utils`-shaped container aliases (`HashMap`/`HashSet`/`StableHashMap`/
# `EntityHashMap`/`SmallVec`, …) to ease porting a Bevy codebase onto Prism by
# changing `use` paths only. The `StableHashMap`/`StableHashSet` aliases wrap
# `std::collections::HashMap`, so this capability layer pulls in `std`. It is
# OFF by default: a non-migrating consumer pays nothing for it.
compat-bevy = ["std"]

[lints]
workspace = true
