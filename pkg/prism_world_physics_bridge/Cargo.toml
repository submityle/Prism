[package]
name = "prism_world_physics_bridge"
version = "0.1.0"
edition = "2024"
description = "Validated world-terrain snapshot adapter for Prism physics heightfields."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
tasks = ["dep:prism_tasks"]

[dependencies]
prism_tasks = { path = "../prism_tasks", optional = true }
prism_physics_gpu = { path = "../prism_physics_gpu" }
prism_world_residency = { path = "../prism_world_residency" }
prism_world_terrain = { path = "../prism_world_terrain" }
glam = { version = "0.33.2", default-features = false, features = ["std"] }

[lints]
workspace = true

[[test]]
name = "sdf_sampling"
path = "text/unit/sdf_sampling.rs"

[[bench]]
name = "sdf_sampling"
path = "text/integration/sdf_sampling_bench.rs"
harness = false

[[test]]
name = "sdf_rebake"
path = "text/unit/sdf_rebake.rs"

[[test]]
name = "sdf_rebake_task"
path = "text/integration/sdf_rebake_task.rs"
required-features = ["tasks"]

[[bench]]
name = "sdf_rebake"
path = "text/integration/sdf_rebake_bench.rs"
harness = false

[[bench]]
name = "sdf_rebake_task"
path = "text/integration/sdf_rebake_task_bench.rs"
harness = false
required-features = ["tasks"]
