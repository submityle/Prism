[package]
name = "prism_world_physics_bridge"
version = "0.1.0"
edition = "2024"
description = "Validated world-terrain snapshot adapter for Prism physics heightfields."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_physics_gpu = { path = "../prism_physics_gpu" }
prism_world_residency = { path = "../prism_world_residency" }
prism_world_terrain = { path = "../prism_world_terrain" }
glam = { version = "0.33.2", default-features = false, features = ["std"] }

[lints]
workspace = true

[[test]]
name = "sdf_sampling"
path = "text/unit/sdf_sampling.rs"

[[bench]]
name = "sdf_sampling"
path = "text/integration/sdf_sampling_bench.rs"
harness = false
