[package]
name = "prism_ui_async"
version = "0.1.0"
edition = "2024"
description = "Loom async layer: Resource futures-free polling, Suspense fallbacks and Error Boundaries over prism_ui_reactive. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ui = { path = "../prism_ui" }
prism_ui_reactive = { path = "../prism_ui_reactive" }

[features]
default = ["std"]
std = ["prism_ui/std", "prism_ui_reactive/std"]

[lints]
workspace = true
