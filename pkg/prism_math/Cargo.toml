[package]
name = "prism_math"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism's numerical-truth kernel: SIMD-shaped vector/matrix/quaternion/affine math with a scalar reference backend. no_std + alloc. L0 root of the Prism dependency graph. Contains no Unreal Engine source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libm = "0.2"
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
# Sibling L1 crate reused for CPU feature probing (MathCaps backend detection).
# default-features disabled so a no_std prism_math does not drag std into the
# platform probe; the `std` feature below forwards through to it.
prism_platform = { path = "../prism_platform", default-features = false }

[features]
default = ["std"]
# Light up std-only conveniences and runtime SIMD feature detection. The core
# facade is no_std and falls back to compile-time `cfg(target_feature=...)`.
std = ["prism_platform/std", "serde?/std"]

# Optional serialization support for the public math value types.
serialize = ["dep:serde", "serde/alloc"]

[[bench]]
name = "batch_transform"
harness = false

[[bench]]
name = "fixed_determinism"
harness = false

[lints]
workspace = true
