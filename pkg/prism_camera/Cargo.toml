[package]
name = "prism_camera"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Engine-neutral camera math for Prism's own renderer: perspective/orthographic projections, view matrices, and Gribb-Hartmann view-frustum extraction with sphere/AABB culling. Replaces bevy_camera's projection/view/frustum role on the RHI render path. Depends only on prism_math; no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_math = { path = "../prism_math", default-features = false }

[features]
default = ["std"]
# Forward the std capability to the math kernel. The camera model itself is
# `no_std + core`; nothing here requires the standard library.
std = ["prism_math/std"]

[lints]
workspace = true
