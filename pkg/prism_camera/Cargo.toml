[package]
name = "prism_camera"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism camera intent, projection, temporal view snapshots, frusta, lens exposure, and view publication"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libm = "0.2"
prism_math = { path = "../prism_math" }
prism_render_architecture = { path = "../prism_render_architecture" }

[features]
default = ["physical_lens", "post", "stereo", "determinism"]
# The core projection/view path is always available. Optional features only
# add their corresponding public contracts and implementation code.
std = []
physical_lens = []
post = []
stereo = []
determinism = []
cutscene = []
autofocus = ["physical_lens"]
shutter = []
view_batch = []
lookahead_stream = []
edge_stabilize = []
virtual_production = []
view_lod = []
composition_aid = []
occlusion_fade = []

[lints]
workspace = true
