[package]
name = "prism_render_material"
version = "0.1.0"
edition = "2024"
description = "Versioned material IR and runtime ABI for Prism"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
prism_render_architecture = { path = "../prism_render_architecture" }
prism_material_pcm = { path = "../prism_material_pcm" }
prism_math = { path = "../prism_math", default-features = false }

[lints]
workspace = true

[dev-dependencies]
prism_material_schema = { path = "../prism_material_schema" }
