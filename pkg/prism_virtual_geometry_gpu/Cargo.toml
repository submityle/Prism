[package]
name = "prism_virtual_geometry_gpu"
version = "0.1.0"
edition = "2024"
description = "Optional wgpu compute twin of Prism's virtual-geometry vis-buffer software rasterizer. Every dispatch is validated texel-for-texel against the CPU golden standard in prism_render_architecture::virtual_geometry. Portable core WGSL (atomic<u32> storage + atomicMax), Metal/Vulkan/DX12 ready. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_render_architecture = { path = "../prism_render_architecture" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal"] }
bytemuck = { version = "1.5", features = ["derive"] }
futures-lite = "2"

[dev-dependencies]
prism_virtual_geometry_gpu = { path = "." }

[features]
default = []

[lints]
workspace = true
