[package]
name = "prism_audio_midi"
version = "0.1.0"
edition = "2024"
description = "Expressive control and MIDI 2.0 / MPE for Prism's next-generation audio engine: Universal MIDI Packet decoding, per-note controllers and pitch, high-resolution controllers, MPE zones, and mapping to engine modulation targets. Classic, no AI/ML. Contains no Unreal Engine, Unity, Godot, Wwise, FMOD, Steam Audio, or Google Resonance Audio source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_midi = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = ["prism_audio_core/std", "bevy_math/std"]
serialize = ["dep:serde", "prism_audio_core/serialize", "bevy_math/serialize"]

[lints]
workspace = true
