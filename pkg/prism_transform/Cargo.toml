[package]
name = "prism_transform"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism transform algebra: local Transform (TRS) and world GlobalTransform (Affine3) with composition, inverse, and helpers. M0 is the standalone algebra layer; ECS-driven hierarchy propagation lands in later milestones. Depends only on prism_math; no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_math = { path = "../prism_math" }
prism_tasks = { path = "../prism_tasks", optional = true }

[features]
default = ["std"]
std = ["prism_math/std", "dep:prism_tasks"]
# Big-world precision: f64 world coordinates + grid-cell origin rebasing (design doc §9).
f64 = []
# Deterministic fixed-point propagation for rollback/lockstep netcode (design doc §12).
determinism = []
# Bevy-shaped prelude: glam-named re-exports and compatibility helpers (design doc §19).
compat-bevy = []

[lints]
workspace = true
