[package]
name = "prism_audio_remote"
version = "0.1.0"
edition = "2024"
description = "Live authoring and remote-tool API for Prism's next-generation audio engine (aligned with Wwise Authoring API and FMOD Studio Live Update): a pluggable AuthoringTransport, read-only telemetry mirroring, a whitelisted write-command set routed through the command ring, live RTPC/bus/attenuation tuning with parameter smoothing, authoring-data hot-reload events, remote profiler session negotiation, and an authentication/command-whitelist security boundary gated to development builds. Classic data-driven control, no AI/ML. Contains no Unreal Engine, Unity, Godot, Wwise, FMOD, Steam Audio, Dolby, or Google Resonance Audio source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_remote = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = [
  "prism_audio_core/std",
  "bevy_math/std",
]
serialize = [
  "dep:serde",
  "prism_audio_core/serialize",
  "bevy_math/serialize",
]

[lints]
workspace = true
