[package]
name = "prism_scene"
version = "0.1.0"
edition = "2024"
description = "Prism scene/template/instance/override runtime (design §5-§15). no_std + alloc; deterministic transactional instantiation, nested typed scenes, residency scheduling, persistence and reload planning. Contains no Unreal Engine source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_asset = { path = "../prism_asset", default-features = false }
prism_ecs = { path = "../prism_ecs", default-features = false }
prism_reflect = { path = "../prism_reflect", optional = true }

[dev-dependencies]
prism_scene = { path = "." }

[features]
default = ["std", "materialize"]
# Unlocks std-backed facilities and the std test harness; the identity /
# override / remap core is fully `no_std + alloc`.
std = ["prism_asset/std", "prism_ecs/std", "prism_ecs/reflect"]
materialize = ["std", "dep:prism_reflect", "prism_ecs/reflect"]
# Durable, scene-owned cell streaming; the ECS partition kernel remains I/O-free.
partition = ["std", "dep:prism_reflect", "prism_ecs/partition", "prism_ecs/serialize"]

[lints]
workspace = true
