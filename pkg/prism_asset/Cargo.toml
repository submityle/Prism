[package]
name = "prism_asset"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism asset kernel: stable asset identity (generational AssetIndex + typed AssetId), reference-counted Handle/weak handles, generational Assets<A> storage with change events and unused-asset reclamation, an asset-path model with sub-labels, a dependency graph with topological load ordering and cycle detection, a deterministic loader-selection policy, per-asset load-state tracking, and (behind `std`) a virtual-file-system data-source abstraction. The no_std+alloc core is the bevy_asset replacement's deterministic heart; concrete format decoders and platform bake live in sibling plugin crates. no_std + alloc core; no bevy_* crate and no Unreal/Unity source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]

[features]
default = ["std"]
# `std` unlocks the virtual-file-system data sources (AssetReader / FsSource /
# MemSource / AssetSources) that back the loader IO half. The identity /
# storage / dependency / loader-policy core is fully `no_std + alloc`.
std = []

[lints]
workspace = true
