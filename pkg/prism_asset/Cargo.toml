[package]
name = "prism_asset"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism asset kernel: stable asset identity (generational AssetIndex + typed AssetId), reference-counted Handle/weak handles, generational Assets<A> storage with change events and unused-asset reclamation, an asset-path model with sub-labels, a dependency graph with topological load ordering and cycle detection, a deterministic loader-selection policy, per-asset load-state tracking, and (behind `std`) a virtual-file-system data-source abstraction. The no_std+alloc core is the bevy_asset replacement's deterministic heart; concrete format decoders and platform bake live in sibling plugin crates. no_std + alloc core; no bevy_* crate and no Unreal/Unity source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_asset_macros = { path = "../prism_asset_macros" }
prism_ecs = { path = "../prism_ecs", optional = true }
prism_tasks = { path = "../prism_tasks", optional = true }
notify-debouncer-full = { version = "0.7.0", default-features = false, optional = true }
rustix = { version = "1.1.5", features = ["fs"], optional = true }

[dev-dependencies]
loom = "0.7.2"

[features]
default = ["std"]
# `ecs` bridges this crate's identity and storage into the ECS: it implements
# `prism_ecs`'s `Resource` for `Assets<A>`, so an asset arena can live in a world
# and be reached by systems. Off by default, so the no_std core stays
# dependency-free; a world-owning crate turns it on.
ecs = ["dep:prism_ecs"]
# `std` unlocks the virtual-file-system data sources (AssetReader / FsSource /
# MemSource / AssetSources) that back the loader IO half. The identity /
# storage / dependency / loader-policy core is fully `no_std + alloc`.
std = ["dep:prism_tasks", "dep:rustix"]
# Enables the platform file watcher adapter. The core change batch/debounce
# model remains available with `std` alone for deterministic tests and
# in-memory sources.
file_watcher = ["std", "dep:notify-debouncer-full"]

[lints]
workspace = true

[[test]]
name = "asset_derive"
path = "text/integration/asset_derive.rs"

[[test]]
name = "dependency_visitor"
path = "text/unit/dependency_visitor.rs"
