[package]
name = "prism_audio_profiler"
version = "0.1.0"
edition = "2024"
description = "Read-only profiling, telemetry aggregation, and visual-debug data model for Prism's next-generation audio engine: session recording and playback of per-block telemetry, meter snapshots (peak/RMS/LUFS/true-peak/correlation), spectrum band energy, voice monitoring with silence diagnostics, compiled-graph inspection, golden per-sample diff, and an Audio-Insights-style aggregate rollup. Classic data-driven analysis, no real-time participation, no AI/ML. Contains no Unreal Engine, Unity, Godot, Wwise, FMOD, Steam Audio, Dolby, or Google Resonance Audio source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_profiler = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = [
  "prism_audio_core/std",
  "bevy_math/std",
]
serialize = [
  "dep:serde",
  "prism_audio_core/serialize",
  "bevy_math/serialize",
]

[lints]
workspace = true
