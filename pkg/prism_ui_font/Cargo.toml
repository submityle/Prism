[package]
name = "prism_ui_font"
version = "0.1.0"
edition = "2024"
description = "Loom embedded font: a self-contained 5x7 printable-ASCII bitmap glyph table (always available, no_std) plus metrics, and an optional `vector` tier that rasterises a real embedded OpenType face (FiraMono, SIL OFL) via ab_glyph for crisp text at any size. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
ab_glyph = { version = "0.2", optional = true }

[features]
default = ["std"]
std = []
# Real vector outline rasterisation via ab_glyph (crisp text). Needs std.
vector = ["dep:ab_glyph", "std"]

[lints]
workspace = true
