[package]
name = "prism_audio_output"
version = "0.1.0"
edition = "2024"
description = "Output rendering/delivery layer for Prism's next-generation audio engine: multichannel downmix matrices (ITU-R BS.775), bass management/LFE crossover, and delivery dynamic-range profiles. Pure classic DSP. Contains no Unreal Engine, Unity, Godot, Wwise, or FMOD source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_output = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = ["prism_audio_core/std", "bevy_math/std"]
serialize = ["dep:serde", "prism_audio_core/serialize", "bevy_math/serialize"]

[lints]
workspace = true
