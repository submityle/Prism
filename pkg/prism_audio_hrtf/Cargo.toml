[package]
name = "prism_audio_hrtf"
version = "0.1.0"
edition = "2024"
description = "HRTF binaural rendering for Prism's next-generation audio engine: SOFA/AES69 HRIR datasets, azimuth/elevation interpolation with ITD alignment, partitioned convolution, and near-field ILD/parallax. Classic DSP only, no machine learning. Contains no Unreal Engine, Unity, Godot, Wwise, FMOD, or Steam Audio source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
# Reuse the listener/emitter geometry and the azimuth/elevation convention so
# HRTF selection agrees bit-for-bit with the rest of the spatial pipeline.
prism_audio_spatial = { path = "../prism_audio_spatial" }
# Deterministic, cross-platform scalar transcendental functions (sin/cos/atan2/
# sqrt/acos/...) plus the glam `Vec3` prelude used for direction geometry.
# `nostd-libm` keeps the math bit-reproducible across targets under `no_std`,
# which the workspace lints enforce.
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_hrtf = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
# Enables std-backed facilities, including on-disk SOFA/AES69 dataset loading.
# The real-time hot path (block convolution) stays allocation-free regardless.
std = ["prism_audio_core/std", "prism_audio_spatial/std", "bevy_math/std"]
# Enables serde (de)serialization of plain, non-real-time description data
# (dataset metadata, measurement grid descriptors).
serialize = [
  "dep:serde",
  "prism_audio_core/serialize",
  "prism_audio_spatial/serialize",
  "bevy_math/serialize",
]

[lints]
workspace = true
