[package]
name = "prism_ui_devtools"
version = "0.1.0"
edition = "2024"
description = "Loom devtools: tree snapshots, backend-op tracing and human-readable inspection for prism_ui runtimes. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ui = { path = "../prism_ui" }

[features]
default = ["std"]
std = ["prism_ui/std"]

[lints]
workspace = true
