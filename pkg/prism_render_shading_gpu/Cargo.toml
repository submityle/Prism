[package]
name = "prism_render_shading_gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Optional wgpu twin of Prism's CPU direct-lighting golden: a WGSL reimplementation of evaluate_principled_direct's base lobe (diffuse/Oren-Nayar, dielectric + metal Fresnel, anisotropic GGX, multiple-scattering compensation, emissive) driven through the frozen prism_render_driver RHI, plus a reusable PBR surface pass. A parity test evaluates a grid of materials on the real device and asserts agreement with the CPU golden within a documented floating-point budget. Contains no Unreal Engine or Unity source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The RHI this pass is built on. Only the frozen trait surface and value types
# are used; the crate names no backend.
prism_render_driver = { path = "../prism_render_driver", features = ["std"] }

[dev-dependencies]
# The shipped backend: brings up the device and provides the buffer read-back
# hook. The library itself never depends on a backend.
prism_render_driver_wgpu = { path = "../../os-backends/prism_render_driver_wgpu" }
# The CPU golden the parity test diffs against.
prism_render_shading = { path = "../prism_render_shading" }
# Compiles the single-sourced WGSL in-sandbox, so a shader error cannot hide
# behind a host that has no adapter to compile it.
naga = { version = "30", features = ["wgsl-in"] }

[lints]
workspace = true
