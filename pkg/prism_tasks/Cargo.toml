[package]
name = "prism_tasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism parallel-runtime kernel: a work-stealing thread pool with per-worker deques, a global injector queue, and atomic Counter fork-join dependencies. Includes structured parallelism, optional stackful fibers, async execution, named lanes, affinity/NUMA placement, deterministic replay, QoS/thread-class routing, cancellation, tracing, and a bevy_tasks-shaped compatibility layer behind feature flags. Contains no Unreal Engine source or derived code and depends on no bevy_* crate."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_platform = { path = "../prism_platform" }
prism_platform_os = { path = "../prism_platform_os" }

[features]
default = ["std", "multi_thread"]
std = []
multi_thread = ["std"]
# Force the synchronous single-threaded fallback: jobs run inline on spawn.
single = ["std"]
# M2: real stackful fibers. `wait` on a non-zero counter suspends the running
# job's fiber (saving its register/stack context) and yields the OS worker to
# other jobs/fibers instead of busy-helping. Off by default; implies the
# multi-threaded pool. When off, `wait` keeps the help-on-wait fallback.
fibers = ["multi_thread"]
# M4: NUMA-aware scheduling. Records intent to prefer same-NUMA-node steals and
# requests node-local per-worker arenas/stacks. The platform capability and
# each arena's placement report whether a real binding was applied; unsupported
# hosts use ordinary memory without fabricating locality.
numa = []
# M6: enable the chrome-tracing (flamegraph-compatible) JSON export on
# `JobTrace`. Span recording and the steal-rate / occupancy counters are
# always available; this feature only compiles the `to_chrome_json` serializer
# and its JSON-escaping helper, so it adds a meaningful opt-in feature combo.
trace = []
# M6: a `bevy_tasks`-compatible prelude (global `ComputeTaskPool` /
# `AsyncComputeTaskPool` / `IoTaskPool` accessors, a `TaskPoolBuilder`, and a
# scope/spawn-shaped pool) mapped onto this crate's `TaskPool`. Off by default;
# adds no scheduling, only re-shapes the existing pool API.
compat-bevy = []

[[bench]]
name = "parallel_scaling"
harness = false

[lints]
workspace = true
