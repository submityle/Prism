[package]
name = "prism_render_runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Prism's RHI-backed render spine: brings up a device/queue through whichever prism_render_driver Instance backend it is given and drives prism_render_graph frames through the frozen RHI, with bounded frames-in-flight and a windowed acquire/import/present loop. Contains no Unreal Engine or Unity source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_render_driver = { path = "../prism_render_driver", features = ["std"] }
prism_render_graph = { path = "../prism_render_graph" }
# The window-handle ABI accepted by `Instance::create_surface` (see the RHI
# crate); the runtime only forwards the handle to the backend.
raw-window-handle = { version = "0.6", default-features = false }
# The default (and, for now, only) RHI backend. Additional `os-backends`
# backends can be selected behind features as they land.
prism_render_driver_wgpu = { path = "../../os-backends/prism_render_driver_wgpu" }

[dev-dependencies]
# The headless reference backend: lets the surface/present loop be exercised
# end to end in CI without a window or a GPU.
prism_render_driver_null = { path = "../../os-backends/prism_render_driver_null" }
# The Render Fabric integration test compiles the real architecture selection
# and lowers that exact plan into this runtime; it is dev-only to keep the
# shipped runtime dependency direction one-way.
prism_render_architecture = { path = "../prism_render_architecture" }

[lints]
workspace = true
