[package]
name = "prism_platform_os"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Real-OS probe twin for prism_platform's portable topology data model. Linux reads genuine CPU/NUMA sysfs geometry and can bind the current thread to a node's CPUs; Apple Silicon macOS has a sysctl topology backend. Unsupported or unavailable hosts return structured non-success results."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_platform = { path = "../prism_platform" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints]
workspace = true
