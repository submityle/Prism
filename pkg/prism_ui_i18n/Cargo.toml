[package]
name = "prism_ui_i18n"
version = "0.1.0"
edition = "2024"
description = "Loom i18n: reactive message catalogs with ICU-style plural selection and argument interpolation for the Loom UI system. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ui_reactive = { path = "../prism_ui_reactive" }

[features]
default = ["std"]
std = ["prism_ui_reactive/std"]

[lints]
workspace = true
