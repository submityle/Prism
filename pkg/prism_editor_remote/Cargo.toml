[package]
name = "prism_editor_remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Transport-neutral editor/runtime synchronization protocol and deterministic codec."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ecs = { path = "../prism_ecs", features = ["reflect"], optional = true }
prism_reflect = { path = "../prism_reflect", default-features = false, features = ["std"], optional = true }

[features]
default = []
ecs = ["dep:prism_ecs", "dep:prism_reflect"]

[lints]
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
