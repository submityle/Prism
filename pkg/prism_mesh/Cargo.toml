[package]
name = "prism_mesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Engine-neutral mesh geometry for Prism's own renderer: a vertex-attribute model (position/normal/uv, optional tangent), a Mesh that owns packed vertex bytes plus index data and the RHI layout describing them, deterministic primitive generators (plane/cube/UV-sphere/cylinder), and the upload that turns a Mesh into prism_render_driver buffers. Replaces bevy_mesh's mesh types on the RHI render path."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The RHI type system: the vertex layout model and the buffer/device/queue
# contract the upload is written against. No backend is named here.
prism_render_driver = { path = "../prism_render_driver", features = ["std"] }

[dev-dependencies]
# The shipped RHI backend, used only by the GPU round-trip test (which skips
# when no adapter is visible, per the workspace's GPU-test convention).
prism_render_driver_wgpu = { path = "../../os-backends/prism_render_driver_wgpu" }

[lints]
workspace = true
