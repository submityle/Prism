[package]
name = "prism_ui_a11y"
version = "0.1.0"
edition = "2024"
description = "Loom accessibility layer: roles, focus order, keyboard navigation and screen-reader labels over prism_ui elements. Contains no Unreal Engine source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_ui = { path = "../prism_ui" }

[features]
default = ["std"]
std = ["prism_ui/std"]

[lints]
workspace = true
