[package]
name = "prism_world_physics_cell_runtime"
version = "0.1.0"
edition = "2024"
description = "Atomic world-cell terrain decoding and physics heightfield residency adapter."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
tasks = ["dep:prism_tasks", "prism_world_physics_bridge/tasks"]

[dependencies]
prism_tasks = { path = "../prism_tasks", optional = true }
prism_world_physics_bridge = { path = "../prism_world_physics_bridge" }
prism_world_runtime = { path = "../prism_world_runtime" }
prism_world_residency = { path = "../prism_world_residency" }
prism_world_stream = { path = "../prism_world_stream" }
prism_world_terrain = { path = "../prism_world_terrain" }

[lints]
workspace = true

[[test]]
name = "sdf_sampling_lifecycle"
path = "text/integration/sdf_sampling_lifecycle.rs"

[[test]]
name = "sdf_cell_codec"
path = "text/unit/sdf_cell_codec.rs"

[[test]]
name = "sdf_cell_file_runtime"
path = "text/integration/sdf_cell_file_runtime.rs"

[[bench]]
name = "sdf_cell_codec"
path = "text/integration/sdf_cell_codec_bench.rs"
harness = false

[[test]]
name = "sdf_cell_rebake"
path = "text/integration/sdf_cell_rebake.rs"
required-features = ["tasks"]

[[bench]]
name = "sdf_cell_rebake"
path = "text/integration/sdf_cell_rebake_bench.rs"
required-features = ["tasks"]
harness = false
