[package]
name = "prism_audio_haptics"
version = "0.1.0"
edition = "2024"
description = "Cross-modal haptic and motion output for Prism's next-generation audio engine: audio-sourced haptic transcoding (band split / rectify / envelope follow / downsample), a parallel haptic bus with per-source sends, a pluggable HapticBackend trait (wide-band high-fidelity, dual-motor rumble, silent fallback), directional spatial weighting, playhead/PDC latency compensation, and governor-driven budget bypass. Classic data-driven DSP, no AI/ML. Contains no Unreal Engine, Unity, Godot, Wwise, FMOD, Steam Audio, Dolby, or Google Resonance Audio source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_haptics = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = [
  "prism_audio_core/std",
  "bevy_math/std",
]
serialize = [
  "dep:serde",
  "prism_audio_core/serialize",
  "bevy_math/serialize",
]

[lints]
workspace = true
