[package]
name = "prism_audio_music"
version = "0.1.0"
edition = "2024"
description = "Interactive music system for Prism's next-generation audio engine: segments/playlists, quantized transitions, stingers, vertical layering, horizontal re-sequencing, and a clip-graph interactive flow. Pure control-rate, data-driven deterministic scheduling with no DSP. Contains no Unreal Engine, Unity, Godot, Wwise, FMOD, Steam Audio, or Google Resonance Audio source or derived code."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core" }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_music = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = ["prism_audio_core/std", "bevy_math/std"]
serialize = ["dep:serde", "prism_audio_core/serialize", "bevy_math/serialize"]

[lints]
workspace = true
