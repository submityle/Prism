[package]
name = "prism_render_architecture"
version = "0.1.0"
edition = "2024"
description = "Architecture contracts for Prism's cross-platform renderer (wgpu runtime + WESL shaders)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
naga = { version = "30", features = ["spv-in"] }
blake3 = { version = "1.8", default-features = false }
prism_render_graph = { path = "../prism_render_graph" }
prism_material_pcm = { path = "../prism_material_pcm" }
# The physics engine owns the authoritative cloth-physics algorithms; the
# render architecture delegates to it so there is a single implementation
# (no render/physics double-implementation of the same solver math).
prism_physics_core = { path = "../prism_physics_core" }
glam = { version = "0.33.2", default-features = false }
prism_math = { path = "../prism_math" }
# POD GPU records are bit-cast to raw bytes and to atomic word arrays; the
# atomic-POD records module re-exports this for its generated code.
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
# The sparse GPU-scene buffers upload through the Prism RHI, so the retained
# scene's buffer storage no longer depends on `bevy_render`.
prism_render_driver = { path = "../prism_render_driver", features = ["std"] }

[dev-dependencies]
# Reference DEFLATE encoder, used only as a round-trip oracle in
# `compression::deflate` tests; never linked into the shipped library.
flate2 = "1.0"
# The wgpu backend, used only by the sparse-buffer upload test's real-device path.
prism_render_driver_wgpu = { path = "../../os-backends/prism_render_driver_wgpu" }

[lints]
workspace = true

[[bench]]
name = "mesh_cluster_scale"
harness = false
