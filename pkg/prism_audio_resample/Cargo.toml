[package]
name = "prism_audio_resample"
version = "0.1.0"
edition = "2024"
description = "Decoupled sample-rate conversion and time/pitch scaling primitives for Prism's next-generation audio engine: graded resamplers (linear/polyphase windowed-sinc/high-order sinc) and time stretchers (WSOLA/SOLA and phase vocoder) sharing a fractional-delay interpolation kernel. Pure classic DSP, deterministic, allocation-free hot path. Contains no Unreal Engine, Unity, Godot, Wwise, FMOD, Steam Audio, or Google Resonance Audio source or derived code; no AI/ML."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_audio_core = { path = "../prism_audio_core", default-features = false }
bevy_math = { path = "../../crates/bevy_math", default-features = false, features = [
  "nostd-libm",
] }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[dev-dependencies]
prism_audio_resample = { path = ".", features = ["serialize"] }

[features]
default = ["std"]
std = ["prism_audio_core/std", "bevy_math/std"]
serialize = ["dep:serde", "prism_audio_core/serialize", "bevy_math/serialize"]

[lints]
workspace = true
