  "pkg/prism_render_runtime",
  # Native render sub-app integration for the Prism application shell.
  "pkg/prism_render_app",
  # Native production launcher and headless frame-loop entry point.
  "pkg/prism_runtime",
  # GPU-driven culling vertical slice (compute cull + indirect draw) on the RHI.
  "pkg/prism_render_gpudriven",
  # Engine-neutral mesh geometry and image data for the RHI render path.
  "pkg/prism_input",
  "pkg/prism_shader",
  "pkg/prism_window",
  "pkg/prism_window_winit",
  # Prism next-generation data-oriented ECS kernel (greenfield chunked-archetype).
  "pkg/prism_ecs",
  # Derive macros (Component/Bundle/SystemSet) for the ECS kernel.
  "pkg/prism_ecs_macros",
  # Prism in-house application shell (App/SubApp/Plugin/schedules/runner).
  "pkg/prism_app",
  # Prism's authority / replication kernel (multiplayer core: command sequencing, state deltas).
  "pkg/prism_replication",
  # Prism's experimental next-generation rendering architecture.
  "pkg/prism_render_architecture",
  "pkg/prism_render_material",
  "pkg/prism_render_material_authoring",
  "pkg/prism_material_schema",
  "pkg/prism_material_pcm",
  # Prism GPU hardware-decode oracle validating the CPU block-compressed texture codecs.
  "pkg/prism_render_material_gpu",
  "pkg/prism_render_scene",
  "pkg/prism_render_shading",
  # Device twin of the CPU direct-lighting golden (WGSL base-lobe mirror + PBR surface pass).
  "pkg/prism_render_visibility",
  "pkg/prism_particle_render",
  "pkg/prism_scene",
  "pkg/prism_scene_bake",
  # World-system policy crates: deterministic stream, residency, and persistence cores.
  "pkg/prism_world_stream",
  "pkg/prism_world_residency",
  "pkg/prism_world_persist",
  "pkg/prism_world",
  # Engine-neutral world proxy visibility contract and optional wgpu compute twin.
  "pkg/prism_world_gpu",
  # World terrain snapshot adapter for the physics heightfield consumer.
  "pkg/prism_world_physics_bridge",
  "pkg/prism_world_physics_cell_runtime",
  "pkg/prism_world_io",
  "pkg/prism_world_network",
  "pkg/prism_world_sim",
  "pkg/prism_world_terrain",
  # Engine-neutral frame coordinator connecting stream policy to cell providers and the scene host boundary.
  "pkg/prism_world_runtime",
  "pkg/prism_state_tree_core",
  "pkg/prism_state_tree_ecs",
  "pkg/prism_state_tree_gpu",
  "pkg/prism_ui_dock",
  # Prism experimental next-generation physics engine.
  "pkg/prism_physics_core",
  "pkg/prism_particle_app",
  "pkg/prism_physics_ecs",
  "pkg/prism_physics_geometry",
  "pkg/prism_physics_gpu",
  # Prism SER ray-coherence GPU radix twin (device sort validated vs CPU golden).
  "pkg/prism_ray_reorder_gpu",
  # Prism Radiance Cascades GI GPU twin (gather/merge/resolve validated vs CPU golden).
  "pkg/prism_radiance_cascades_gpu",
  # Prism runtime virtual-texturing GPU page-table lookup twin (device search vs CPU golden).
  "pkg/prism_virtual_texture_gpu",
  # Prism GDeflate asset-streaming GPU de-interleave twin (device word transpose vs CPU golden).
  "pkg/prism_gdeflate_gpu",
  # Prism motion-vector closest-depth dilation GPU twin (device neighborhood gather vs CPU golden).
  "pkg/prism_motion_gpu",
  # Prism experimental virtual-geometry GPU software-raster twin.
  "pkg/prism_virtual_geometry_gpu",
  # Prism experimental volumetric-cloud scattering GPU twin.
  "pkg/prism_volumetric_gpu",
  "pkg/prism_water_render",
  # Prism experimental strand-hair body-collider projection GPU twin.
  "pkg/prism_hair_gpu",
  # Prism device-free Opacity Micromap (OMM) CPU golden baker.
  "pkg/prism_micromap",
  # Prism device-free Displaced Micro-Map (DMM) CPU golden baker.
  "pkg/prism_dmm",
  # Prism real-device wgpu twin of the Opacity Micromap (OMM) baker.
  "pkg/prism_micromap_gpu",
  # Prism real-device wgpu twin of the Displaced Micro-Map (DMM) baker.
  "pkg/prism_dmm_gpu",
  # Prism experimental next-generation audio engine.
  "pkg/prism_audio_core",
  # Prism next-generation audio engine real-time runtime bridge (command/telemetry rings + epoch reclamation).
  "pkg/prism_audio_rt",
  # Prism next-generation audio engine device/offline/capture backends (cpal output + WAV sink + input capture).
  "pkg/prism_audio_device",
  # Prism next-generation audio engine spatial layer (listener/emitter geometry, attenuation, cones, Doppler, panning, air absorption, Ambisonics).
  "pkg/prism_audio_spatial",
  # Prism next-generation audio engine HRTF binaural layer (SOFA/AES69 HRIR datasets, ITD-aligned interpolation, partitioned convolution, near-field ILD/parallax).
  "pkg/prism_audio_hrtf",
  # Prism next-generation audio engine content/authoring model (Event/Action/RTPC/State/Switch/Container).
  "pkg/prism_audio_content",
  # Prism next-generation audio engine output delivery layer (downmix matrix/bass management/delivery profiles).
  "pkg/prism_audio_output",
  # Prism next-generation audio engine interactive music system (segments/playlists/quantized transitions/stingers/vertical layering/clip graph).
  "pkg/prism_audio_music",
  # Prism next-generation audio engine decoupled resampling + time/pitch scaling primitives (graded resamplers / WSOLA / phase vocoder).
  "pkg/prism_audio_resample",
  # Prism next-generation audio engine compiled-graph execution planner (topo/levels/islands/liveness/PDC/parallel schedule).
  "pkg/prism_audio_exec",
  # Prism next-generation audio engine procedural content graph (Patch) and full modulation system.
  "pkg/prism_audio_authoring",
  # Prism next-generation audio engine performance governor and psychoacoustic virtualization.
  "pkg/prism_audio_governor",
  # Prism next-generation audio engine physics-coupled procedural audio and procedural soundscape.
  "pkg/prism_audio_procedural",
  # Prism next-generation audio engine asset banks, streaming, codecs and dialogue/localization.
  "pkg/prism_audio_assets",
  # Prism next-generation audio engine Symphonia-backed compressed codecs implementing the pluggable SourceDecoder.
  "pkg/prism_audio_codec",
  # Prism next-generation audio engine real-time communication (uplink DSP/jitter buffer/PLC/positional voice).
  "pkg/prism_audio_comm",
  # Prism next-generation audio engine expressive control and MIDI 2.0 / MPE.
  "pkg/prism_audio_midi",
  # Prism next-generation audio engine wave-acoustics baking and runtime perceptual parameter fields.
  "pkg/prism_audio_wave",
  # Prism next-generation audio engine object-based/immersive output.
  "pkg/prism_audio_object",
  "pkg/prism_audio_immersive",
  "pkg/prism_audio_haptics",
  "pkg/prism_audio_remote",
  "pkg/prism_audio_accessibility",
  "pkg/prism_audio_physics",
  "pkg/prism_audio_conditioning",
  "pkg/prism_audio_snapshot",
  # Prism next-generation audio engine geometric acoustics propagation backend.
  "pkg/prism_audio_geometry",
  # Prism next-generation audio engine optional wgpu compute backend.
  "pkg/prism_audio_geometry_gpu",
  "pkg/prism_audio_profiler",
  "pkg/prism_audio_ecs",
  # Prism Loom: next-generation declarative UI/scene notation.
  "pkg/prism_ui_reactive",
  "pkg/prism_ui_layout",
  "pkg/prism_ui_style",
  "pkg/prism_ui_anim",
  "pkg/prism_ui_tree",
  "pkg/prism_ui",
  "pkg/prism_ui_macro",
  "pkg/prism_ui_store",
  "pkg/prism_ui_i18n",
  "pkg/prism_ui_router",
  "pkg/prism_ui_devtools",
  "pkg/prism_ui_component",
  "pkg/prism_ui_overlay",
  "pkg/prism_ui_form",
  "pkg/prism_ui_virtual",
  "pkg/prism_ui_async",
  "pkg/prism_ui_scheduler",
  "pkg/prism_ui_a11y",
  "pkg/prism_ui_motion",
  "pkg/prism_ui_scoped",
  "pkg/prism_ui_snapshot",
  "pkg/prism_ui_workbench",
  "pkg/prism_ui_timetravel",
  "pkg/prism_ui_inspector",
  "pkg/prism_ui_hotreload",
  "pkg/prism_ui_ecs",
  "pkg/prism_ui_input",
  "pkg/prism_ui_theme",
  "pkg/prism_ui_sdui",
  "pkg/prism_ui_font",
  "pkg/prism_ui_text",
  "pkg/prism_ui_render_backend",
  "pkg/prism_ui_component_kit",
  "pkg/prism_editor_core",
  "pkg/prism_editor_timeline",
  "pkg/prism_editor_panels",
  "pkg/prism_editor_graph",
  "pkg/prism_editor_reflect",
  "pkg/prism_editor_world",
  "pkg/prism_editor_remote",
  "pkg/prism_editor_viewport",
  "pkg/prism_editor_content",
  "pkg/prism_editor_shell",
  "pkg/prism_editor_profiler",
  "pkg/prism_editor_dock",
  "pkg/prism_editor_app",
  "pkg/prism_editor_ui",
  "pkg/prism_editor_collab",
  "pkg/prism_editor_domains",
  # Prism graph-based visual scripting engine and host integration boundary.
  "pkg/prism_visual_scripting",
  # Prism WASM Component sandbox and execution infrastructure.
  "pkg/prism_wasm",
]
default-members = ["pkg/prism_runtime"]
exclude = [
  # Integration tests are not part of the workspace.
  "tests-integration",
  # The controlled ECS performance gate is a Python runner, not a Rust crate.
  "tools/ecs-perf",
  # Retained source trees and compatibility packages are not workspace members.
  "crates/*",
  "examples/*",
  "tests/*",
  "benches",
  "errors",
  "tools/*",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"

[workspace.lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"
print_stderr = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.stress-test]
inherits = "release"
lto = "fat"
panic = "abort"
