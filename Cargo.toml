[workspace]
resolver = "3"
members = [
  "pkg/prism_utils",
  "pkg/prism_reflect_macros",
  "pkg/prism_reflect",
  "pkg/prism_settings",
  "pkg/prism_settings_io",
  "pkg/prism_time",
  "pkg/prism_tasks",
  "pkg/prism_transform",
  "pkg/prism_transform_ecs",
  "pkg/prism_camera",
  "pkg/prism_camera_gpu",
  "pkg/prism_camera_ecs",
  "pkg/prism_camera_rig",
  "pkg/prism_diagnostic",
  "pkg/prism_platform",
  "pkg/prism_math",
  "pkg/prism_math_gpu",
  "pkg/prism_transform_gpu",
  # Engine-neutral camera math (projection/view/frustum) for the RHI render path.
  "pkg/prism_platform_os",
  "pkg/prism_asset",
  "pkg/prism_asset_macros",
  "pkg/prism_asset_container",
  "pkg/prism_asset_build_core",
  "pkg/prism_asset_build_cli",
