[package]
name = "render_triangle"
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
description = "M0 acceptance demo: a windowed triangle drawn through Prism's RHI (prism_render_driver + prism_render_graph) and presented on a real surface."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
prism_render_driver = { path = "../../pkg/prism_render_driver", features = ["std"] }
prism_render_graph = { path = "../../pkg/prism_render_graph" }
prism_render_runtime = { path = "../../pkg/prism_render_runtime" }
winit = "0.30"

[lints]
workspace = true
