name: Prism scene portable replay

permissions:
  contents: read

on:
  merge_group:
  pull_request:
  push:
    branches:
      - release-*

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # Keep warnings visible without failing on unrelated feature-gated dead code.
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  native-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-rust

      - name: Test scene snapshot wire contract and replay
        run: cargo test -p prism_scene

      - name: Test world durable scene replay and rollback
        run: cargo test -p prism_world --features scene_host --lib
